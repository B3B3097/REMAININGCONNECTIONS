name: Utility Discovery Pipeline

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: не коммитить результаты"
        required: false
        type: boolean
        default: false
      max_repos:
        description: "Сколько репозиториев искать за запрос"
        required: false
        type: string
        default: "80"
      max_probe:
        description: "Сколько утилит детально проверять"
        required: false
        type: string
        default: "300"
      include_readme:
        description: "Читать README для определения платформ"
        required: false
        type: boolean
        default: true
      skip_search:
        description: "Пропустить поиск (только проверка существующих данных)"
        required: false
        type: boolean
        default: false
      min_stars:
        description: "Минимум звёзд для включения в результаты"
        required: false
        type: string
        default: "0"

concurrency:
  group: utils-discovery
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write

env:
  PYTHON_VERSION: "3.11"
  OUTPUT_DIR: "data"
  OUTPUT_FILE: "data/utils_found.json"
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 REMAININGCONNECTIONS/1.0"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: 1 - Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Create directories
        run: |
          mkdir -p raw candidates probed "${OUTPUT_DIR}"
          echo "[+] Directories created"
      - name: Write run metadata
        env:
          MAX_REPOS: ${{ github.event.inputs.max_repos || '80' }}
          MAX_PROBE: ${{ github.event.inputs.max_probe || '300' }}
          MIN_STARS: ${{ github.event.inputs.min_stars || '0' }}
        run: |
          python <<'PY'
          import json, datetime, os
          payload = {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "workflow": "utils-discovery",
              "repository": "${{ github.repository }}",
              "actor": "${{ github.actor }}",
              "event_name": "${{ github.event_name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
              "max_repos": os.getenv("MAX_REPOS", "80"),
              "max_probe": os.getenv("MAX_PROBE", "300"),
              "include_readme": "${{ github.event.inputs.include_readme }}" != "false",
              "dry_run": "${{ github.event.inputs.dry_run }}" == "true",
              "skip_search": "${{ github.event.inputs.skip_search }}" == "true",
              "min_stars": int(os.getenv("MIN_STARS", "0")),
          }
          os.makedirs("raw", exist_ok=True)
          with open("raw/utils_run_metadata.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          print("[+] Metadata saved")
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: utils-prepare-metadata
          path: raw/utils_run_metadata.json
          if-no-files-found: error
          retention-days: 7

  search-github-keywords:
    name: 2 - Search GitHub keywords
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ github.event.inputs.skip_search != true }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: v2ray-client
            query: "v2ray client OR v2ray gui"
          - slug: xray-client
            query: "xray client OR xray gui"
          - slug: singbox-client
            query: "sing-box client OR singbox gui"
          - slug: clash-client
            query: "clash client OR clash gui"
          - slug: mihomo-client
            query: "mihomo client OR clash meta gui"
          - slug: shadowsocks-client
            query: "shadowsocks client OR shadowsocks gui"
          - slug: trojan-client
            query: "trojan client OR trojan gui"
          - slug: hysteria-client
            query: "hysteria client OR hysteria2 client"
          - slug: wireguard-client
            query: "wireguard client OR wireguard gui"
          - slug: android-proxy
            query: "android proxy client OR android vpn client"
          - slug: android-v2ray
            query: "v2ray android OR xray android"
          - slug: android-singbox
            query: "sing-box android OR singbox android"
          - slug: android-clash
            query: "clash android OR mihomo android"
          - slug: ios-proxy
            query: "ios proxy client OR ios vpn client"
          - slug: ios-v2ray
            query: "ios v2ray OR ios xray"
          - slug: windows-proxy
            query: "windows proxy client OR windows vpn gui"
          - slug: windows-clash
            query: "clash windows OR clash verge"
          - slug: windows-v2ray
            query: "v2ray windows OR xray windows"
          - slug: linux-proxy
            query: "linux proxy client OR linux vpn gui"
          - slug: linux-clash
            query: "clash linux OR mihomo linux"
          - slug: cross-platform-proxy
            query: "cross platform proxy client OR universal proxy client"
          - slug: proxy-manager
            query: "proxy manager OR subscription manager"
          - slug: subscription-client
            query: "subscription client OR subscription converter gui"
          - slug: open-source-vpn
            query: "open source vpn client OR open source proxy client"
          - slug: proxy-gui
            query: "proxy gui OR vpn gui"
          - slug: hiddify
            query: "hiddify OR hiddify-next"
          - slug: nekobox
            query: "nekobox OR nekobox-android"
          - slug: v2rayng
            query: "v2rayng OR v2ray-ng"
          - slug: clash-verge
            query: "clash verge OR clash-verge-rev"
          - slug: mihomo-party
            query: "mihomo party OR mihomo-party"
          - slug: proxy-panel
            query: "proxy panel OR vpn panel OR proxy dashboard"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install utilities
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Search GitHub repositories
        env:
          QUERY: ${{ matrix.query }}
          SLUG: ${{ matrix.slug }}
          MAX_REPOS: ${{ github.event.inputs.max_repos || '80' }}
        run: |
          set -euo pipefail
          mkdir -p raw
          OUT="raw/utils_github_keyword_${SLUG}.jsonl"
          API_OUT="raw/utils_github_keyword_api_${SLUG}.json"
          : > "${OUT}"
          FULL_QUERY="${QUERY} fork:true archived:false"
          if ! gh api -X GET search/repositories -f q="${FULL_QUERY}" -f per_page="${MAX_REPOS}" -f sort=stars -f order=desc > "${API_OUT}" 2>/dev/null; then
            echo '{"items":[]}' > "${API_OUT}"
          fi
          jq -c --arg slug "$SLUG" '.items[]? | {source:"github",kind:"keyword",query_slug:$slug,repo:.full_name,name:.name,url:.html_url,stars:.stargazers_count,forks:.forks_count,description:.description,language:.language,topics:.topics,updated_at:.updated_at,pushed_at:.pushed_at,archived:.archived,fork:.fork} | select(.repo != null)' "${API_OUT}" >> "${OUT}" 2>/dev/null || true
          echo "[+] Found: $(wc -l < "${OUT}")"
          sleep $((RANDOM % 6 + 3))
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utils-search-keyword-${{ matrix.slug }}
          path: raw/utils_github_keyword_${{ matrix.slug }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

  search-github-topics:
    name: 3 - Search GitHub topics
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ github.event.inputs.skip_search != true }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: topic-v2ray
            query: "topic:v2ray"
          - slug: topic-xray
            query: "topic:xray"
          - slug: topic-singbox
            query: "topic:sing-box"
          - slug: topic-clash
            query: "topic:clash"
          - slug: topic-mihomo
            query: "topic:mihomo"
          - slug: topic-shadowsocks
            query: "topic:shadowsocks"
          - slug: topic-trojan
            query: "topic:trojan"
          - slug: topic-hysteria
            query: "topic:hysteria"
          - slug: topic-hysteria2
            query: "topic:hysteria2"
          - slug: topic-tuic
            query: "topic:tuic"
          - slug: topic-wireguard
            query: "topic:wireguard"
          - slug: topic-proxy
            query: "topic:proxy"
          - slug: topic-vpn
            query: "topic:vpn"
          - slug: topic-android
            query: "topic:android"
          - slug: topic-ios
            query: "topic:ios"
          - slug: topic-windows
            query: "topic:windows"
          - slug: topic-linux
            query: "topic:linux"
          - slug: topic-gui
            query: "topic:gui"
          - slug: topic-client
            query: "topic:client"
          - slug: topic-subscription
            query: "topic:subscription"
          - slug: topic-censorship
            query: "topic:censorship-circumvention"
          - slug: topic-clash-verge
            query: "topic:clash-verge"
          - slug: topic-mihomo-party
            query: "topic:mihomo-party"
          - slug: topic-hiddify
            query: "topic:hiddify"
          - slug: topic-nekobox
            query: "topic:nekobox"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install utilities
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Search by topic
        env:
          QUERY: ${{ matrix.query }}
          SLUG: ${{ matrix.slug }}
          MAX_REPOS: ${{ github.event.inputs.max_repos || '80' }}
        run: |
          set -euo pipefail
          mkdir -p raw
          OUT="raw/utils_github_${SLUG}.jsonl"
          API_OUT="raw/utils_github_api_${SLUG}.json"
          : > "${OUT}"
          FULL_QUERY="${QUERY} fork:true archived:false"
          if ! gh api -X GET search/repositories -f q="${FULL_QUERY}" -f per_page="${MAX_REPOS}" -f sort=stars -f order=desc > "${API_OUT}" 2>/dev/null; then
            echo '{"items":[]}' > "${API_OUT}"
          fi
          jq -c --arg slug "$SLUG" '.items[]? | {source:"github",kind:"topic",query_slug:$slug,repo:.full_name,name:.name,url:.html_url,stars:.stargazers_count,forks:.forks_count,description:.description,language:.language,topics:.topics,updated_at:.updated_at,pushed_at:.pushed_at,archived:.archived,fork:.fork} | select(.repo != null)' "${API_OUT}" >> "${OUT}" 2>/dev/null || true
          echo "[+] Found: $(wc -l < "${OUT}")"
          sleep $((RANDOM % 6 + 3))
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utils-search-${{ matrix.slug }}
          path: raw/utils_github_${{ matrix.slug }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

  collect-candidates:
    name: 4 - Collect candidates
    runs-on: ubuntu-latest
    needs: [search-github-keywords, search-github-topics]
    if: ${{ always() }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create directories
        run: mkdir -p raw candidates
      - name: Download search artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: utils-search-*
          path: candidates
          merge-multiple: true
      - name: Normalize candidates
        run: |
          python <<'PY'
          import os, json, glob
          files = glob.glob("candidates/**/*.jsonl", recursive=True) + glob.glob("raw/**/*.jsonl", recursive=True)
          out_path = "raw/utils_candidates.jsonl"
          seen = {}
          total = 0
          for fp in sorted(files):
              try:
                  with open(fp, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line: continue
                          total += 1
                          try: obj = json.loads(line)
                          except: continue
                          repo = obj.get("repo")
                          if not repo: continue
                          if repo not in seen:
                              seen[repo] = obj
                          else:
                              old = seen[repo]
                              old_slugs = old.get("query_slugs", [])
                              if old.get("query_slug") and old["query_slug"] not in old_slugs:
                                  old_slugs.append(old["query_slug"])
                              new_slug = obj.get("query_slug")
                              if new_slug and new_slug not in old_slugs:
                                  old_slugs.append(new_slug)
                              old["query_slugs"] = old_slugs
                              if obj.get("stars", 0) > old.get("stars", 0):
                                  old["stars"] = obj.get("stars", 0)
                              if len(obj.get("description") or "") > len(old.get("description") or ""):
                                  old["description"] = obj.get("description")
                              old_topics = set(old.get("topics") or [])
                              new_topics = set(obj.get("topics") or [])
                              old["topics"] = list(old_topics | new_topics)
              except Exception as e:
                  print(f"[!] Error reading {fp}: {e}")
          candidates = list(seen.values())
          candidates.sort(key=lambda x: x.get("stars", 0), reverse=True)
          os.makedirs("raw", exist_ok=True)
          with open(out_path, "w", encoding="utf-8") as out:
              for item in candidates:
                  out.write(json.dumps(item, ensure_ascii=False) + "\n")
          print(f"[*] Total: {total}")
          print(f"[+] Unique: {len(candidates)}")
          PY
      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: utils-candidates
          path: raw/utils_candidates.jsonl
          if-no-files-found: warn
          retention-days: 7

  probe-utilities:
    name: 5 - Probe utilities
    runs-on: ubuntu-latest
    needs: collect-candidates
    if: ${{ always() }}
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Create directories
        run: mkdir -p raw probed "${OUTPUT_DIR}"
      - name: Download candidates
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: utils-candidates
          path: raw
      - name: Probe utilities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_PROBE: ${{ github.event.inputs.max_probe || '300' }}
          INCLUDE_README: ${{ github.event.inputs.include_readme != false && '1' || '0' }}
          MIN_STARS: ${{ github.event.inputs.min_stars || '0' }}
        run: |
          python <<'PY'
          import os, re, json, time, random, datetime, requests
          GITHUB_API = "https://api.github.com"
          TOKEN = os.getenv("GITHUB_TOKEN", "")
          UA = os.getenv("USER_AGENT", "REMAININGCONNECTIONS/1.0")
          MAX_PROBE = int(os.getenv("MAX_PROBE", "300"))
          INCLUDE_README = os.getenv("INCLUDE_README", "1") == "1"
          MIN_STARS = int(os.getenv("MIN_STARS", "0"))
          UTILS_OUTPUT = os.getenv("OUTPUT_FILE", "data/utils_found.json")
          HEADERS = {"Accept":"application/vnd.github+json","User-Agent":UA}
          if TOKEN:
              HEADERS["Authorization"] = f"Bearer {TOKEN}"
          session = requests.Session()
          session.headers.update(HEADERS)
          ANDROID_KEYS = ["android",".apk",".aab","apk","play google","f-droid","fdroid","android app","android client"]
          IOS_KEYS = ["ios","iphone","ipad",".ipa","ipa","testflight","app store","ios app","ios client"]
          WINDOWS_KEYS = ["windows","win64","win32","win-arm",".exe",".msi",".msix",".appx","portable.exe","windows app"]
          LINUX_KEYS = ["linux","ubuntu","debian","fedora","archlinux","arch linux","appimage",".deb",".rpm",".snap",".flatpak",".pkg.tar.zst",".tar.gz",".tar.xz",".tar.zst",".tar.bz2","linux app"]
          def now_iso():
              return datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z")
          def parse_date(v):
              if not v: return None
              try:
                  v = v.replace("Z","+00:00")
                  dt = datetime.datetime.fromisoformat(v)
                  if dt.tzinfo is None: dt = dt.replace(tzinfo=datetime.timezone.utc)
                  return dt
              except: return None
          def days_since(dt):
              if not dt: return None
              return int((datetime.datetime.now(datetime.timezone.utc) - dt).total_seconds() / 86400)
          def fetch_json(url, params=None):
              for attempt in range(3):
                  try:
                      r = session.get(url, params=params, timeout=25)
                      if r.status_code == 200: return r.json()
                      if r.status_code == 404: return None
                      if r.status_code in (403,429):
                          ra = r.headers.get("Retry-After")
                          wait = int(ra) if ra and ra.isdigit() else 6
                          time.sleep(wait); continue
                      if 500 <= r.status_code < 600:
                          time.sleep(2+attempt); continue
                      return None
                  except Exception:
                      time.sleep(2+attempt)
              return None
          def fetch_text(url, accept=None):
              try:
                  headers = {}
                  if accept: headers["Accept"] = accept
                  r = session.get(url, headers=headers, timeout=25)
                  if r.status_code == 200 and r.text: return r.text
                  return None
              except Exception:
                  return None
          def detect_from_text(text, flags):
              if not text: return flags
              low = text.lower()
              if any(x in low for x in ANDROID_KEYS): flags["android"] = True
              if any(x in low for x in IOS_KEYS): flags["ios"] = True
              if any(x in low for x in WINDOWS_KEYS): flags["windows"] = True
              if any(x in low for x in LINUX_KEYS): flags["linux"] = True
              return flags
          def detect_from_asset_name(name):
              flags = {"android":False,"ios":False,"windows":False,"linux":False}
              if not name: return flags
              n = name.lower()
              if n.endswith((".apk",".aab")) or "android" in n: flags["android"] = True
              if n.endswith(".ipa") or "ios" in n or "iphone" in n or "ipad" in n: flags["ios"] = True
              if n.endswith((".exe",".msi",".msix",".appx")) or "windows" in n or ("win" in n and ("64" in n or "32" in n or "arm" in n)): flags["windows"] = True
              if n.endswith((".appimage",".deb",".rpm",".snap",".flatpak",".pkg.tar.zst")) or "linux" in n: flags["linux"] = True
              return flags
          def merge_flags(target, source):
              for key in target:
                  if source.get(key): target[key] = True
              return target
          def platform_labels(flags):
              labels = []
              if flags.get("android"): labels.append("Android")
              if flags.get("ios"): labels.append("iOS")
              if flags.get("windows"): labels.append("Windows")
              if flags.get("linux"): labels.append("Linux")
              return labels
          def make_status(release_age_days, pushed_at):
              if release_age_days is None:
                  pushed_days = days_since(parse_date(pushed_at))
                  if pushed_days is not None and pushed_days <= 90: return "no_release_recent_repo"
                  return "no_release"
              if release_age_days <= 365: return "active"
              if release_age_days <= 730: return "stale"
              return "outdated"
          def calculate_score(stars, flags, release_age_days, has_release):
              platforms_count = sum(1 for x in flags.values() if x)
              score = stars + platforms_count * 2500
              if has_release and release_age_days is not None:
                  score += max(0, 6000 - release_age_days * 8)
              return int(score)
          cands = []
          if os.path.exists("raw/utils_candidates.jsonl"):
              with open("raw/utils_candidates.jsonl","r",encoding="utf-8") as f:
                  for line in f:
                      line=line.strip()
                      if not line: continue
                      try: cands.append(json.loads(line))
                      except: continue
          print(f"[*] Candidates: {len(cands)}")
          if MIN_STARS > 0:
              cands = [c for c in cands if c.get("stars",0) >= MIN_STARS]
              print(f"[*] After stars filter (>= {MIN_STARS}): {len(cands)}")
          cands.sort(key=lambda x: x.get("stars",0), reverse=True)
          utilities = []
          for idx, c in enumerate(cands[:MAX_PROBE], 1):
              repo = c.get("repo")
              if not repo: continue
              print(f"[*] {idx}/{min(len(cands),MAX_PROBE)}: {repo}")
              rd = fetch_json(f"{GITHUB_API}/repos/{repo}")
              if not rd:
                  time.sleep(1); continue
              full_name = rd.get("full_name", repo)
              html_url = rd.get("html_url", c.get("url"))
              name = rd.get("name", c.get("name", full_name.split("/")[-1]))
              description = rd.get("description") or c.get("description")
              language = rd.get("language")
              topics = rd.get("topics") or c.get("topics") or []
              stars = rd.get("stargazers_count", c.get("stars",0))
              forks = rd.get("forks_count", c.get("forks",0))
              pushed_at = rd.get("pushed_at")
              archived = rd.get("archived", False)
              flags = {"android":False,"ios":False,"windows":False,"linux":False}
              detect_from_text(" ".join(topics), flags)
              detect_from_text(name, flags)
              detect_from_text(description, flags)
              release = fetch_json(f"{GITHUB_API}/repos/{repo}/releases/latest")
              if not release:
                  rels = fetch_json(f"{GITHUB_API}/repos/{repo}/releases", params={"per_page":1})
                  if isinstance(rels, list) and rels: release = rels[0]
              has_release=False; tag=None; rname=None; rurl=None; rpub=None; rage=None; rassets=[]
              if release:
                  has_release=True
                  tag = release.get("tag_name")
                  rname = release.get("name") or release.get("tag_name")
                  rurl = release.get("html_url")
                  rpub = release.get("published_at") or release.get("created_at")
                  rage = days_since(parse_date(rpub))
                  for asset in (release.get("assets",[]) or [])[:20]:
                      an = asset.get("name"); au = asset.get("browser_download_url")
                      if not an or not au: continue
                      af = detect_from_asset_name(an)
                      merge_flags(flags, af)
                      rassets.append({"name":an,"url":au,"size_mb":round((asset.get("size") or 0)/(1024*1024),2),"content_type":asset.get("content_type"),"platform_hint":platform_labels(af)})
              if INCLUDE_README and (not any(flags.values()) or not has_release):
                  rt = fetch_text(f"{GITHUB_API}/repos/{repo}/readme", accept="application/vnd.github.raw")
                  if rt: detect_from_text(rt[:80000], flags)
              labels = platform_labels(flags)
              status = make_status(rage, pushed_at)
              score = calculate_score(stars, flags, rage, has_release)
              utilities.append({"id":idx,"name":name,"full_name":full_name,"url":html_url,"description":description,"language":language,"topics":topics,"stars":stars,"forks":forks,"archived":archived,"pushed_at":pushed_at,"query_slugs":c.get("query_slugs",[]),"has_release":has_release,"latest_release_tag":tag,"latest_release_name":rname,"latest_release_url":rurl,"latest_release_published_at":rpub,"release_age_days":rage,"platforms":flags,"platform_labels":labels,"platforms_text":", ".join(labels) if labels else "Unknown","release_assets_count":len(rassets),"release_assets":rassets[:12],"status":status,"score":score})
              time.sleep(random.uniform(0.35, 1.1))
          utilities.sort(key=lambda x: x["score"], reverse=True)
          for idx, item in enumerate(utilities, 1):
              item["id"] = idx
          summary = {
              "total_utilities": len(utilities),
              "with_release": sum(1 for x in utilities if x["has_release"]),
              "without_release": sum(1 for x in utilities if not x["has_release"]),
              "android": sum(1 for x in utilities if x["platforms"]["android"]),
              "ios": sum(1 for x in utilities if x["platforms"]["ios"]),
              "windows": sum(1 for x in utilities if x["platforms"]["windows"]),
              "linux": sum(1 for x in utilities if x["platforms"]["linux"]),
              "active": sum(1 for x in utilities if x["status"]=="active"),
              "stale": sum(1 for x in utilities if x["status"]=="stale"),
              "outdated": sum(1 for x in utilities if x["status"]=="outdated"),
              "no_release": sum(1 for x in utilities if x["status"]=="no_release"),
              "no_release_recent_repo": sum(1 for x in utilities if x["status"]=="no_release_recent_repo"),
          }
          payload = {"generated_at":now_iso(),"generator":"utils-discovery.yml","project":"REMAININGCONNECTIONS dashboard","telegram_channel":"https://t.me/REMAININGCONNECTIONS","candidates_checked":len(utilities),"summary":summary,"utilities":utilities}
          os.makedirs(os.path.dirname(UTILS_OUTPUT), exist_ok=True)
          with open("probed/utils_probed.json","w",encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          with open(UTILS_OUTPUT,"w",encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          print(f"Utilities: {summary['total_utilities']}")
          print(f"With release: {summary['with_release']}")
          print(f"Android: {summary['android']}")
          print(f"iOS: {summary['ios']}")
          print(f"Windows: {summary['windows']}")
          print(f"Linux: {summary['linux']}")
          PY
      - name: Upload utility results
        uses: actions/upload-artifact@v4
        with:
          name: utils-results
          path: |
            probed/utils_probed.json
            data/utils_found.json
          if-no-files-found: warn
          retention-days: 14

  publish-results:
    name: 6 - Publish results
    runs-on: ubuntu-latest
    needs: probe-utilities
    if: ${{ always() && needs.probe-utilities.result == 'success' && github.event.inputs.dry_run != true }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create directories
        run: mkdir -p data downloaded
      - name: Download utility results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: utils-results
          path: downloaded
      - name: Move result into data directory
        run: |
          set -euo pipefail
          FOUND_FILE="$(find downloaded -type f -name 'utils_found.json' | head -n 1 || true)"
          if [[ -z "${FOUND_FILE}" ]]; then
            echo "[!] Not found, creating placeholder"
            cat > data/utils_found.json <<'JSON'
          {"generated_at":"","generator":"utils-discovery.yml","candidates_checked":0,"summary":{"total_utilities":0,"with_release":0,"without_release":0,"android":0,"ios":0,"windows":0,"linux":0,"active":0,"stale":0,"outdated":0,"no_release":0,"no_release_recent_repo":0},"utilities":[]}
          JSON
          else
            cp "${FOUND_FILE}" data/utils_found.json
            echo "[+] File copied"
          fi
      - name: Commit and push data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add data/utils_found.json || true
          if git diff --staged --quiet; then
            echo "[*] No changes"
          else
            git commit -m "chore(data): update utils_found.json [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
            echo "[+] Committed"
          fi

  report:
    name: 7 - Report
    runs-on: ubuntu-latest
    needs: [collect-candidates, probe-utilities, publish-results]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download utility results for report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: utils-results
          path: utils-report-artifacts
      - name: Print report
        run: |
          echo "=================================================="
          echo " Utility Discovery Pipeline finished"
          echo "=================================================="
          FILE="$(find utils-report-artifacts -type f -name 'utils_found.json' | head -n 1 || true)"
          if [[ -z "${FILE}" ]]; then
            echo "[!] No results file"
            exit 0
          fi
          python <<PY
          import json
          path = "${FILE}"
          try:
              with open(path,"r",encoding="utf-8") as f:
                  data = json.load(f)
              summary = data.get("summary",{})
              utilities = data.get("utilities",[])
              print(f"Generated: {data.get('generated_at')}")
              print(f"Utilities: {summary.get('total_utilities')}")
              print(f"With release: {summary.get('with_release')}")
              print(f"Android: {summary.get('android')}")
              print(f"iOS: {summary.get('ios')}")
              print(f"Windows: {summary.get('windows')}")
              print(f"Linux: {summary.get('linux')}")
              print(f"Active: {summary.get('active')}")
              print("\nTop-10 by score:")
              for item in utilities[:10]:
                  print(f"  - {item.get('name')} | stars: {item.get('stars')} | {item.get('platforms_text')} | release: {item.get('latest_release_tag') or 'none'}")
          except Exception as e:
              print(f"[!] Report error: {e}")
          PY
          echo "=================================================="