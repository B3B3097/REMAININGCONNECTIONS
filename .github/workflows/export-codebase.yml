name: Export Codebase to TXT

on:
  workflow_dispatch:
    inputs:
      include_binaries:
        description: "Включать бинарные файлы (картинки и т.д.)"
        required: false
        type: boolean
        default: false

      max_file_size:
        description: "Максимальный размер файла (KB)"
        required: false
        type: string
        default: "500"

      commit_result:
        description: "Коммитить результат в репозиторий"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  export:
    name: Export codebase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

