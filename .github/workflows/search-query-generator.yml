name: Search Query Generator

on:
  schedule:
    # Каждые 6 часов, в 40 минут
    - cron: "40 */6 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: не коммитить результаты"
        required: false
        type: boolean
        default: false

      commit_generated:
        description: "Коммитить сгенерированные запросы"
        required: false
        type: boolean
        default: true

      target:
        description: "Целевой проект/репозиторий (например: Throne или owner/repo)"
        required: false
        type: string
        default: ""

      target_aliases:
        description: "Алиасы цели через запятую или пробел"
        required: false
        type: string
        default: ""

      existing_data:
        description: "Файлы для адаптивной генерации"
        required: false
        type: string
        default: "data/subscriptions_found.json,data/found.json,data/tg_proxies_found.json,data/utils_found.json"

      max_repo_queries:
        description: "Лимит запросов для репозиториев на категорию"
        required: false
        type: string
        default: "1200"

      max_code_queries:
        description: "Лимит запросов для кода на категорию"
        required: false
        type: string
        default: "800"

      max_topic_queries:
        description: "Лимит запросов для тем"
        required: false
        type: string
        default: "300"

      max_gitverse_queries:
        description: "Лимит запросов для Gitverse"
        required: false
        type: string
        default: "800"

      adaptive_terms:
        description: "Сколько адаптивных терминов брать из существующих данных"
        required: false
        type: string
        default: "120"

      seed:
        description: "Seed для воспроизводимой генерации"
        required: false
        type: string
        default: "1337"

      include_experimental:
        description: "Включить экспериментальные запросы"
        required: false
        type: boolean
        default: true

      validate_queries:
        description: "Валидировать синтаксис запросов"
        required: false
        type: boolean
        default: true

concurrency:
  group: search-query-generator
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write

env:
  PYTHON_VERSION: "3.11"
  OUTPUT_DIR: ".github/generated"
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

  TARGET: ${{ github.event.inputs.target || '' }}
  TARGET_ALIASES_RAW: ${{ github.event.inputs.target_aliases || '' }}
  EXISTING_DATA_RAW: ${{ github.event.inputs.existing_data || 'data/subscriptions_found.json,data/found.json,data/tg_proxies_found.json,data/utils_found.json' }}

  MAX_REPO_QUERIES: ${{ github.event.inputs.max_repo_queries || '1200' }}
  MAX_CODE_QUERIES: ${{ github.event.inputs.max_code_queries || '800' }}
  MAX_TOPIC_QUERIES: ${{ github.event.inputs.max_topic_queries || '300' }}
  MAX_GITVERSE_QUERIES: ${{ github.event.inputs.max_gitverse_queries || '800' }}
  ADAPTIVE_TERMS: ${{ github.event.inputs.adaptive_terms || '120' }}
  SEED: ${{ github.event.inputs.seed || '1337' }}

  DRY_RUN: ${{ github.event.inputs.dry_run == true && '1' || '0' }}
  COMMIT_GENERATED: ${{ github.event.inputs.commit_generated == false && '0' || '1' }}
  INCLUDE_EXPERIMENTAL: ${{ github.event.inputs.include_experimental == true && '1' || '0' }}
  VALIDATE_QUERIES: ${{ github.event.inputs.validate_queries == true && '1' || '0' }}

  USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 REMAININGCONNECTIONS/1.0"

defaults:
  run:
    shell: bash

jobs:
  # =========================================================
  # 1. ПОДГОТОВКА
  # =========================================================
  prepare:
    name: 1 · Подготовка
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create directories
        run: |
          mkdir -p "${OUTPUT_DIR}"
          mkdir -p data
          echo "[+] Директории созданы"

      - name: Write run metadata
        run: |
          python <<'PY'
          import json
          import datetime
          import os

          payload = {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "workflow": "search-query-generator",
              "repository": "${{ github.repository }}",
              "actor": "${{ github.actor }}",
              "event_name": "${{ github.event_name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
              "target": os.getenv("TARGET", ""),
              "max_repo_queries": int(os.getenv("MAX_REPO_QUERIES", "1200")),
              "max_code_queries": int(os.getenv("MAX_CODE_QUERIES", "800")),
              "max_topic_queries": int(os.getenv("MAX_TOPIC_QUERIES", "300")),
              "max_gitverse_queries": int(os.getenv("MAX_GITVERSE_QUERIES", "800")),
              "adaptive_terms": int(os.getenv("ADAPTIVE_TERMS", "120")),
              "seed": int(os.getenv("SEED", "1337")),
              "include_experimental": os.getenv("INCLUDE_EXPERIMENTAL", "1") == "1",
              "validate_queries": os.getenv("VALIDATE_QUERIES", "1") == "1",
              "dry_run": os.getenv("DRY_RUN", "0") == "1",
              "commit_generated": os.getenv("COMMIT_GENERATED", "1") == "1",
          }

          os.makedirs(".github/generated", exist_ok=True)
          with open(".github/generated/run_metadata.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print("[+] Метаданные сохранены")
          PY

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: query-gen-metadata
          path: .github/generated/run_metadata.json
          if-no-files-found: error
          retention-days: 7

  # =========================================================
  # 2. ГЕНЕРАЦИЯ ЗАПРОСОВ
  # =========================================================
  generate-queries:
    name: 2 · Генерация запросов
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create output directory
        run: mkdir -p "${OUTPUT_DIR}"

      - name: Generate search queries
        env:
          TARGET: ${{ env.TARGET }}
          TARGET_ALIASES_RAW: ${{ env.TARGET_ALIASES_RAW }}
          EXISTING_DATA_RAW: ${{ env.EXISTING_DATA_RAW }}
          MAX_REPO_QUERIES: ${{ env.MAX_REPO_QUERIES }}
          MAX_CODE_QUERIES: ${{ env.MAX_CODE_QUERIES }}
          MAX_TOPIC_QUERIES: ${{ env.MAX_TOPIC_QUERIES }}
          MAX_GITVERSE_QUERIES: ${{ env.MAX_GITVERSE_QUERIES }}
          ADAPTIVE_TERMS: ${{ env.ADAPTIVE_TERMS }}
          SEED: ${{ env.SEED }}
          INCLUDE_EXPERIMENTAL: ${{ env.INCLUDE_EXPERIMENTAL }}
          VALIDATE_QUERIES: ${{ env.VALIDATE_QUERIES }}
        run: |
          python <<'PY'
          import argparse
          import datetime as dt
          import hashlib
          import json
          import os
          import random
          import re
          from collections import Counter

          # =========================================================
          # КОНСТАНТЫ
          # =========================================================

          SUB_PROTOCOLS = [
              "vless", "vmess", "xray", "reality", "sing-box", "singbox",
              "clash", "clash-meta", "mihomo", "shadowsocks", "shadowsocks-rust",
              "trojan", "trojan-go", "hysteria", "hysteria2", "hy2",
              "tuic", "wireguard", "proxy", "vpn",
          ]

          TG_PROTOCOLS = [
              "mtproto", "mtproxy", "telegram proxy", "tg proxy",
              "t.me proxy", "tg://proxy", "mtproto secret", "mtproxy secret",
              "dd secret", "ee secret",
          ]

          UTIL_PROTOCOLS = [
              "v2ray", "xray", "vless", "vmess", "sing-box", "singbox",
              "clash", "clash-meta", "mihomo", "shadowsocks", "trojan",
              "hysteria", "hysteria2", "tuic", "wireguard", "proxy", "vpn",
              "subscription",
          ]

          PLATFORMS = [
              "android", "ios", "iphone", "ipad", "windows", "linux",
              "ubuntu", "debian", "fedora", "arch", "macos", "desktop", "mobile",
          ]

          REGIONS = [
              "nl", "de", "fr", "fi", "se", "pl", "lt", "lv", "ee",
              "ro", "bg", "es", "it", "ch", "uk", "us", "ca", "sg",
              "jp", "kr", "eu", "asia", "global",
          ]

          SUB_INTENTS_EN = [
              "subscription", "subscriptions", "sub", "subs", "node list",
              "nodes", "free nodes", "proxy list", "config list",
              "aggregator", "aggregation", "collector", "mirror",
              "archive", "daily update", "auto update",
          ]

          SUB_INTENTS_RU = [
              "подписка", "подписки", "подписка прокси", "подписка vpn",
              "узлы", "бесплатные узлы", "конфиги", "конфигурации",
              "обход блокировок", "остаться на связи", "рабочие подписки",
              "актуальные подписки",
          ]

          TG_INTENTS_EN = [
              "proxy", "proxies", "telegram proxy", "tg proxy",
              "mtproto proxy", "mtproxy list", "proxy list", "free proxy",
              "secret", "server port secret", "tg link", "tg links",
          ]

          TG_INTENTS_RU = [
              "телеграм прокси", "тг прокси", "мтпрокси", "мтпрото",
              "прокси телеграм", "прокси список", "бесплатный прокси",
              "секрет", "остаться на связи",
          ]

          UTIL_INTENTS_EN = [
              "client", "gui", "ui", "app", "application", "manager",
              "dashboard", "desktop", "mobile", "cross platform",
              "open source", "release", "releases", "binary", "binaries",
          ]

          UTIL_INTENTS_RU = [
              "клиент", "приложение", "программа", "интерфейс", "менеджер",
              "панель", "утилита", "утилиты", "обход блокировок",
          ]

          SUB_FILENAMES = [
              "sub.txt", "subscribe.txt", "subscription.txt", "subscriptions.txt",
              "v2ray.txt", "xray.txt", "nodes.txt", "proxy.txt", "proxies.txt",
              "list.txt", "clash.yaml", "clash.yml", "config.yaml", "config.yml",
              "sub.yaml", "sub.yml", "subscription.yaml", "subscription.yml",
              "proxies.yaml", "proxies.yml", "mihomo.yaml", "mihomo.yml",
              "sing-box.json", "singbox.json", "wireguard.conf", "wg.conf",
          ]

          TG_FILENAMES = [
              "mtproxy.txt", "mtproxy-list.txt", "mtproto.txt",
              "tg-proxy.txt", "tg-proxies.txt", "telegram-proxy.txt",
              "telegram-proxies.txt", "proxy.txt", "proxies.txt",
              "proxy-list.txt", "list.txt", "tg.txt", "tg.md",
              "proxy.md", "proxies.md", "mtproxy.md", "mtproto.md",
              "README.md", "free-tg-proxy.txt", "tg-proxy.json",
              "mtproxy.json", "mtproto.json", "proxy.yaml", "proxies.yaml",
          ]

          UTIL_FILENAMES = [
              "README.md", "RELEASE.md", "CHANGELOG.md", "package.json",
              "pubspec.yaml", "build.gradle", "build.gradle.kts", "Cargo.toml",
              "go.mod", "requirements.txt", "pyproject.toml", "setup.py",
              "CMakeLists.txt",
          ]

          TOPICS = [
              "v2ray", "xray", "vless", "vmess", "reality", "sing-box",
              "singbox", "clash", "clash-meta", "mihomo", "shadowsocks",
              "trojan", "hysteria", "hysteria2", "tuic", "wireguard",
              "proxy", "vpn", "subscription", "subscriptions", "android",
              "ios", "windows", "linux", "gui", "client", "mtproto",
              "mtproxy", "telegram", "censorship-circumvention",
          ]

          LANGUAGES = [
              "Go", "Python", "Kotlin", "Dart", "TypeScript", "JavaScript",
              "C#", "C++", "Rust", "Java", "Swift", "Shell",
          ]

          STAR_FILTERS = [
              "stars:>5", "stars:>20", "stars:>100", "stars:>500", "stars:>1000",
          ]

          RECENT_DAYS = [7, 30, 90, 180, 365]

          STOPWORDS = {
              "the", "and", "for", "with", "from", "this", "that", "are",
              "was", "were", "not", "you", "your", "our", "out", "new",
              "file", "files", "update", "updated", "github", "gitverse",
              "http", "https", "html", "json", "yaml", "yml", "txt",
              "readme", "null", "true", "false", "config", "configs",
              "configuration", "proxy", "proxies", "vpn", "subscription",
              "subscriptions", "sub", "client", "clients", "server",
              "servers", "list", "lists", "free", "node", "nodes",
          }

          HARVEST_KEYS = {
              "name", "repo", "full_name", "description", "topics",
              "platform_labels", "protocol_hint", "region_hint",
              "query_slug", "last_commit_message", "secret_type",
          }

          WORD_RE = re.compile(r"[A-Za-z][A-Za-z0-9_-]{2,}|[А-Яа-яЁё]{3,}")

          # =========================================================
          # УТИЛИТЫ
          # =========================================================

          def collapse_spaces(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def make_query_id(query):
              return hashlib.md5(query.encode("utf-8")).hexdigest()[:12]

          def normalize_for_dedupe(query):
              return collapse_spaces(query.lower())

          def build_query(*parts):
              cleaned = []
              for part in parts:
                  if not part:
                      continue
                  if isinstance(part, (list, tuple, set)):
                      part = " ".join(str(x) for x in part if x)
                  part = collapse_spaces(str(part))
                  if part:
                      cleaned.append(part)
              return collapse_spaces(" ".join(cleaned))

          def make_entry(category, qtype, query, priority, reason, qualifiers=None):
              query = collapse_spaces(query)
              if not query:
                  return None

              qualifiers = qualifiers or []
              full_query_parts = [query]
              if qualifiers:
                  full_query_parts.extend(qualifiers)
              full_query = collapse_spaces(" ".join(full_query_parts))

              return {
                  "id": make_query_id(full_query),
                  "category": category,
                  "type": qtype,
                  "query": query,
                  "full_query": full_query,
                  "qualifiers": qualifiers,
                  "priority": int(priority),
                  "reason": reason,
              }

          def finalize_entries(entries, limit, category, qtype):
              seen = set()
              unique = []

              for entry in entries:
                  if not entry:
                      continue
                  key = normalize_for_dedupe(entry["full_query"])
                  if key in seen:
                      continue
                  seen.add(key)
                  unique.append(entry)

              for entry in unique:
                  entry["_noise"] = random.random()

              unique.sort(
                  key=lambda x: (
                      x["priority"],
                      x["_noise"],
                  ),
                  reverse=True,
              )

              if limit > 0 and len(unique) > limit:
                  unique = unique[:limit]

              result = []
              for idx, entry in enumerate(unique, start=1):
                  entry.pop("_noise", None)
                  entry["slug"] = f"{category}-{qtype}-{idx:04d}"
                  result.append(entry)

              return result

          # =========================================================
          # АДАПТАЦИЯ
          # =========================================================

          def harvest_value(value, counter):
              if value is None:
                  return
              if isinstance(value, str):
                  words = WORD_RE.findall(value.lower())
                  for word in words:
                      word = word.strip()
                      if len(word) < 3:
                          continue
                      if word in STOPWORDS:
                          continue
                      counter[word] += 1
              elif isinstance(value, (list, tuple, set)):
                  for item in value:
                      harvest_value(item, counter)

          def harvest_terms_from_json(obj, counter):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key in HARVEST_KEYS:
                          harvest_value(value, counter)
                      else:
                          harvest_terms_from_json(value, counter)
              elif isinstance(obj, list):
                  for item in obj:
                      harvest_terms_from_json(item, counter)

          def load_adaptive_terms(paths, top_n=120):
              counter = Counter()

              for path in paths:
                  if not path:
                      continue
                  if not os.path.exists(path):
                      continue
                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          data = json.load(f)
                      harvest_terms_from_json(data, counter)
                      print(f"[+] Собраны термины из: {path}")
                  except Exception as e:
                      print(f"[!] Ошибка сбора из {path}: {e}")

              terms = [word for word, _ in counter.most_common(top_n)]
              print(f"[+] Адаптивных терминов загружено: {len(terms)}")
              return terms

          # =========================================================
          # ЦЕЛЕВЫЕ ЗАПРОСЫ
          # =========================================================

          def generate_target_queries(target, aliases=None):
              entries = []
              if not target:
                  return entries

              aliases = aliases or []
              variants = set()

              base = collapse_spaces(target)
              if base:
                  variants.add(base)
                  variants.add(base.lower())
                  variants.add(base.upper())
                  variants.add(base.replace(" ", "-"))
                  variants.add(base.replace(" ", "_"))
                  variants.add(base.replace(" ", ""))
                  variants.add(base.replace("-", " "))
                  variants.add(base.replace("_", " "))

              for alias in aliases:
                  alias = collapse_spaces(alias)
                  if not alias:
                      continue
                  variants.add(alias)
                  variants.add(alias.lower())
                  variants.add(alias.replace(" ", "-"))
                  variants.add(alias.replace(" ", "_"))
                  variants.add(alias.replace(" ", ""))

              variants = sorted(variants)

              for variant in variants:
                  entries.append(
                      make_entry(
                          category="target",
                          qtype="repo",
                          query=f'"{variant}" in:name',
                          priority=100,
                          reason="target exact name",
                          qualifiers=["fork:true", "archived:false"],
                      )
                  )

                  entries.append(
                      make_entry(
                          category="target",
                          qtype="repo",
                          query=f'"{variant}" in:name,description,readme',
                          priority=98,
                          reason="target name/description/readme",
                          qualifiers=["fork:true", "archived:false"],
                      )
                  )

                  entries.append(
                      make_entry(
                          category="target",
                          qtype="repo",
                          query=f'"{variant}" mirror',
                          priority=95,
                          reason="target mirror",
                          qualifiers=["fork:true", "archived:false"],
                      )
                  )

                  entries.append(
                      make_entry(
                          category="target",
                          qtype="repo",
                          query=f'"{variant}" fork',
                          priority=90,
                          reason="target fork",
                          qualifiers=["fork:true", "archived:false"],
                      )
                  )

                  entries.append(
                      make_entry(
                          category="target",
                          qtype="repo",
                          query=f'"{variant}" alternative',
                          priority=85,
                          reason="target alternative",
                          qualifiers=["fork:true", "archived:false"],
                      )
                  )

                  entries.append(
                      make_entry(
                          category="target",
                          qtype="repo",
                          query=f'"{variant}" release',
                          priority=80,
                          reason="target release",
                          qualifiers=["fork:true", "archived:false"],
                      )
                  )

                  entries.append(
                      make_entry(
                          category="target",
                          qtype="code",
                          query=f'"{variant}"',
                          priority=92,
                          reason="target code mention",
                      )
                  )

              if "/" in base:
                  owner, repo = base.split("/", 1)
                  entries.append(
                      make_entry(
                          category="target",
                          qtype="repo",
                          query=f"user:{owner}",
                          priority=99,
                          reason="target owner",
                          qualifiers=["fork:true", "archived:false"],
                      )
                  )
                  entries.append(
                      make_entry(
                          category="target",
                          qtype="repo",
                          query=f"{owner} {repo}",
                          priority=99,
                          reason="target owner repo",
                          qualifiers=["fork:true", "archived:false"],
                      )
                  )

              return finalize_entries(entries, limit=500, category="target", qtype="mixed")

          # =========================================================
          # ЗАПРОСЫ ДЛЯ ПОДПИСОК
          # =========================================================

          def generate_subscription_repo_queries(extra_terms=None, target_terms=None, include_experimental=True):
              entries = []
              extra_terms = extra_terms or []
              target_terms = target_terms or []

              all_protocols = SUB_PROTOCOLS[:]

              # Протокол + назначение
              for protocol in all_protocols:
                  for intent in SUB_INTENTS_EN:
                      entries.append(
                          make_entry(
                              category="subscriptions",
                              qtype="repo",
                              query=build_query(protocol, intent),
                              priority=92,
                              reason="protocol+intent",
                              qualifiers=["fork:true", "archived:false"],
                          )
                      )

                  for intent in SUB_INTENTS_RU:
                      entries.append(
                          make_entry(
                              category="subscriptions",
                              qtype="repo",
                              query=build_query(protocol, intent),
                              priority=88,
                              reason="protocol+ru-intent",
                              qualifiers=["fork:true", "archived:false"],
                          )
                      )

              # Протокол + платформа
              for protocol in all_protocols:
                  for platform in PLATFORMS:
                      entries.append(
                          make_entry(
                              category="subscriptions",
                              qtype="repo",
                              query=build_query(protocol, platform, "subscription"),
                              priority=84,
                              reason="protocol+platform",
                              qualifiers=["fork:true", "archived:false"],
                          )
                      )

              # Протокол + регион
              for protocol in all_protocols[:12]:
                  for region in REGIONS:
                      entries.append(
                          make_entry(
                              category="subscriptions",
                              qtype="repo",
                              query=build_query(protocol, region, "nodes"),
                              priority=70,
                              reason="protocol+region",
                              qualifiers=["fork:true", "archived:false"],
                          )
                      )

              # Ру-сегмент
              for intent in SUB_INTENTS_RU:
                  for word in ["остаться на связи", "обход блокировок", "рабочие подписки"]:
                      entries.append(
                          make_entry(
                              category="subscriptions",
                              qtype="repo",
                              query=build_query(intent, word),
                              priority=82,
                              reason="ru intent",
                              qualifiers=["fork:true", "archived:false"],
                          )
                      )

              # Свежие репозитории
              now = dt.datetime.utcnow()
              for days in RECENT_DAYS:
                  date = (now - dt.timedelta(days=days)).strftime("%Y-%m-%d")
                  for protocol in all_protocols[:14]:
                      entries.append(
                          make_entry(
                              category="subscriptions",
                              qtype="repo",
                              query=build_query(protocol, "subscription", f"pushed:>{date}"),
                              priority=80,
                              reason=f"recent {days} days",
