          # =========================================================
          # ЗАПИСЬ РЕЗУЛЬТАТОВ
          # =========================================================

          def write_json(path, payload):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)
              print(f"[+] Сохранён JSON: {path}")

          def write_txt(path, entries):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  for entry in entries:
                      f.write(entry["full_query"] + "\n")
              print(f"[+] Сохранён TXT: {path}")

          def write_yaml(path, entries):
              os.makedirs(os.path.dirname(path), exist_ok=True)

              lines = [
                  "# Auto-generated search queries",
                  "# Do not edit manually if generated by CI.",
                  "queries:",
              ]

              for entry in entries:
                  lines.append(f"  - slug: {json.dumps(entry['slug'], ensure_ascii=False)}")
                  lines.append(f"    query: {json.dumps(entry['query'], ensure_ascii=False)}")
                  lines.append(f"    full_query: {json.dumps(entry['full_query'], ensure_ascii=False)}")
                  lines.append(f"    category: {json.dumps(entry['category'], ensure_ascii=False)}")
                  lines.append(f"    type: {json.dumps(entry['type'], ensure_ascii=False)}")
                  lines.append(f"    priority: {entry['priority']}")
                  lines.append(f"    reason: {json.dumps(entry['reason'], ensure_ascii=False)}")

              with open(path, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

              print(f"[+] Сохранён YAML: {path}")

          def write_matrix_json(path, entries):
              matrix = []
              for entry in entries:
                  matrix.append({
                      "slug": entry["slug"],
                      "query": entry["query"],
                      "full_query": entry["full_query"],
                      "priority": entry["priority"],
                      "reason": entry["reason"],
                  })

              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(matrix, f, ensure_ascii=False, indent=2)

              print(f"[+] Сохранён matrix JSON: {path}")

          # =========================================================
          # ОСНОВНАЯ ГЕНЕРАЦИЯ
          # =========================================================

          def generate_all(args):
              random.seed(args.seed)

              adaptive_terms = load_adaptive_terms(args.existing_data, top_n=args.adaptive_terms)

              target_terms = []
              if args.target:
                  target_terms = [args.target]
                  if args.target_aliases:
                      target_terms.extend(args.target_aliases)

              # TARGET
              target_entries = generate_target_queries(args.target, args.target_aliases or [])

              # SUBSCRIPTIONS
              sub_repo_raw = generate_subscription_repo_queries(adaptive_terms, target_terms, args.include_experimental)
              sub_code_raw = generate_subscription_code_queries(adaptive_terms)
              sub_topic_raw = generate_subscription_topic_queries()
              sub_gitverse_raw = generate_subscription_gitverse_queries(adaptive_terms)

              sub_repo = finalize_entries(sub_repo_raw, args.max_repo_queries, "subscriptions", "repo")
              sub_code = finalize_entries(sub_code_raw, args.max_code_queries, "subscriptions", "code")
              sub_topic = finalize_entries(sub_topic_raw, args.max_topic_queries, "subscriptions", "topic")
              sub_gitverse = finalize_entries(sub_gitverse_raw, args.max_gitverse_queries, "subscriptions", "gitverse")

              # TG PROXIES
              tg_repo_raw = generate_tg_proxy_repo_queries(adaptive_terms, target_terms, args.include_experimental)
              tg_code_raw = generate_tg_proxy_code_queries(adaptive_terms)
              tg_gitverse_raw = generate_tg_proxy_gitverse_queries(adaptive_terms)

              tg_repo = finalize_entries(tg_repo_raw, args.max_repo_queries, "tg_proxies", "repo")
              tg_code = finalize_entries(tg_code_raw, args.max_code_queries, "tg_proxies", "code")
              tg_gitverse = finalize_entries(tg_gitverse_raw, args.max_gitverse_queries, "tg_proxies", "gitverse")

              # UTILITIES
              util_repo_raw = generate_utilities_repo_queries(adaptive_terms, target_terms, args.include_experimental)
              util_code_raw = generate_utilities_code_queries(adaptive_terms)
              util_topic_raw = generate_utilities_topic_queries()
              util_gitverse_raw = generate_utilities_gitverse_queries(adaptive_terms)

              util_repo = finalize_entries(util_repo_raw, args.max_repo_queries, "utilities", "repo")
              util_code = finalize_entries(util_code_raw, args.max_code_queries, "utilities", "code")
              util_topic = finalize_entries(util_topic_raw, args.max_topic_queries, "utilities", "topic")
              util_gitverse = finalize_entries(util_gitverse_raw, args.max_gitverse_queries, "utilities", "gitverse")

              payload = {
                  "generated_at": dt.datetime.utcnow().isoformat() + "Z",
                  "generator": "search-query-generator.yml",
                  "target": args.target,
                  "target_aliases": args.target_aliases or [],
                  "adaptive_terms": adaptive_terms,
                  "categories": {
                      "target": {
                          "mixed": target_entries,
                      },
                      "subscriptions": {
                          "repo": sub_repo,
                          "code": sub_code,
                          "topic": sub_topic,
                          "gitverse": sub_gitverse,
                      },
                      "tg_proxies": {
                          "repo": tg_repo,
                          "code": tg_code,
                          "gitverse": tg_gitverse,
                      },
                      "utilities": {
                          "repo": util_repo,
                          "code": util_code,
                          "topic": util_topic,
                          "gitverse": util_gitverse,
                      },
                  },
                  "summary": {
                      "target": len(target_entries),
                      "subscriptions_repo": len(sub_repo),
                      "subscriptions_code": len(sub_code),
                      "subscriptions_topic": len(sub_topic),
                      "subscriptions_gitverse": len(sub_gitverse),
                      "tg_proxies_repo": len(tg_repo),
                      "tg_proxies_code": len(tg_code),
                      "tg_proxies_gitverse": len(tg_gitverse),
                      "utilities_repo": len(util_repo),
                      "utilities_code": len(util_code),
                      "utilities_topic": len(util_topic),
                      "utilities_gitverse": len(util_gitverse),
                  },
              }

              return payload

          # =========================================================
          # CLI
          # =========================================================

          def main():
              parser = argparse.ArgumentParser(
                  description="Автогенератор поисковых запросов для GitHub/Gitverse."
              )

              parser.add_argument(
                  "--output-dir",
                  default=".github/generated",
                  help="Куда сохранять сгенерированные файлы",
              )

              parser.add_argument(
                  "--target",
                  default="",
                  help="Целевой репозиторий или проект",
              )

              parser.add_argument(
                  "--target-aliases",
                  nargs="*",
                  default=[],
                  help="Дополнительные варианты имени целевого проекта",
              )

              parser.add_argument(
                  "--existing-data",
                  nargs="*",
                  default=[
                      "data/subscriptions_found.json",
                      "data/found.json",
                      "data/tg_proxies_found.json",
                      "data/utils_found.json",
                  ],
                  help="JSON-файлы для адаптивной генерации",
              )

              parser.add_argument(
                  "--adaptive-terms",
                  type=int,
                  default=120,
                  help="Сколько адаптивных терминов брать",
              )

              parser.add_argument(
                  "--max-repo-queries",
                  type=int,
                  default=1200,
                  help="Лимит запросов для репозиториев на категорию",
              )

              parser.add_argument(
                  "--max-code-queries",
                  type=int,
                  default=800,
                  help="Лимит запросов для кода на категорию",
              )

              parser.add_argument(
                  "--max-topic-queries",
                  type=int,
                  default=300,
                  help="Лимит запросов для тем",
              )

              parser.add_argument(
                  "--max-gitverse-queries",
                  type=int,
                  default=800,
                  help="Лимит запросов для Gitverse",
              )

              parser.add_argument(
                  "--include-experimental",
                  action="store_true",
                  default=True,
                  help="Включить экспериментальные запросы",
              )

              parser.add_argument(
                  "--no-experimental",
                  action="store_true",
                  default=False,
                  help="Отключить экспериментальные запросы",
              )

              parser.add_argument(
                  "--seed",
                  type=int,
                  default=1337,
                  help="Seed для воспроизводимой генерации",
              )

              args = parser.parse_args()

              if args.no_experimental:
                  args.include_experimental = False

              print("==================================================")
              print(" Search Query Generator")
              print("==================================================")

              payload = generate_all(args)

              output_dir = args.output_dir
              os.makedirs(output_dir, exist_ok=True)

              # Общий JSON
              write_json(os.path.join(output_dir, "queries.json"), payload)

              # Целевые запросы
              target_entries = payload["categories"]["target"]["mixed"]
              write_txt(os.path.join(output_dir, "queries_target.txt"), target_entries)
              write_yaml(os.path.join(output_dir, "queries_target.yaml"), target_entries)
              write_matrix_json(os.path.join(output_dir, "matrix_target.json"), target_entries)

              # Подписки
              for qtype in ["repo", "code", "topic", "gitverse"]:
                  entries = payload["categories"]["subscriptions"][qtype]
                  write_txt(os.path.join(output_dir, f"queries_subscriptions_{qtype}.txt"), entries)
                  write_yaml(os.path.join(output_dir, f"queries_subscriptions_{qtype}.yaml"), entries)
                  write_matrix_json(os.path.join(output_dir, f"matrix_subscriptions_{qtype}.json"), entries)

              # ТГ прокси
              for qtype in ["repo", "code", "gitverse"]:
                  entries = payload["categories"]["tg_proxies"][qtype]
                  write_txt(os.path.join(output_dir, f"queries_tg_proxies_{qtype}.txt"), entries)
                  write_yaml(os.path.join(output_dir, f"queries_tg_proxies_{qtype}.yaml"), entries)
                  write_matrix_json(os.path.join(output_dir, f"matrix_tg_proxies_{qtype}.json"), entries)

              # Утилиты
              for qtype in ["repo", "code", "topic", "gitverse"]:
                  entries = payload["categories"]["utilities"][qtype]
                  write_txt(os.path.join(output_dir, f"queries_utilities_{qtype}.txt"), entries)
                  write_yaml(os.path.join(output_dir, f"queries_utilities_{qtype}.yaml"), entries)
                  write_matrix_json(os.path.join(output_dir, f"matrix_utilities_{qtype}.json"), entries)

              print("==================================================")
              print(" Сводка генерации")
              print("==================================================")

              for key, value in payload["summary"].items():
                  print(f"{key}: {value}")

              print("==================================================")
              print(f"Директория: {output_dir}")
              print("Готово.")

          if __name__ == "__main__":
              main()
          PY

      - name: Upload generated queries
        uses: actions/upload-artifact@v4
        with:
          name: generated-queries
          path: .github/generated/
          if-no-files-found: error
          retention-days: 14

  # =========================================================
  # 3. ВАЛИДАЦИЯ
  # =========================================================
  validate-queries:
    name: 3 · Валидация
    runs-on: ubuntu-latest
    needs: generate-queries
    if: env.VALIDATE_QUERIES == '1'
    timeout-minutes: 10

    steps:
      - name: Download generated queries
        uses: actions/download-artifact@v4
        with:
          name: generated-queries
          path: generated-validate

      - name: Validate JSON files
        run: |
          python <<'PY'
          import glob
          import json
          import os
          import sys

          files = glob.glob("generated-validate/**/*.json", recursive=True)

          if not files:
              print("[!] JSON файлы не найдены")
              sys.exit(1)

          failed = []

          for file_path in files:
              try:
                  with open(file_path, "r", encoding="utf-8") as f:
                      json.load(f)
                  print(f"[OK] {file_path}")
              except Exception as e:
                  print(f"[FAIL] {file_path}: {e}")
                  failed.append(file_path)

          if failed:
              print(f"[!] Ошибки в {len(failed)} файлах")
              sys.exit(1)

          print(f"[+] Проверено JSON файлов: {len(files)}")
          PY

      - name: Check important files exist
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "generated-validate/queries.json"
            "generated-validate/matrix_subscriptions_repo.json"
            "generated-validate/matrix_tg_proxies_repo.json"
            "generated-validate/matrix_utilities_repo.json"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "[!] Отсутствует обязательный файл: $file"
              exit 1
            fi
            echo "[OK] $file"
          done

          echo "[+] Все обязательные файлы на месте"

      - name: Check query counts
        run: |
          python <<'PY'
          import json
          import os

          queries_file = "generated-validate/queries.json"

          if not os.path.exists(queries_file):
              print("[!] queries.json не найден")
              exit(1)

          with open(queries_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          summary = data.get("summary", {})

          print("Количество запросов по категориям:")
          for key, value in summary.items():
              print(f"  {key}: {value}")

          total = sum(summary.values())
          print(f"\nВсего запросов: {total}")

          if total < 100:
              print("[!] Слишком мало запросов!")
              exit(1)

          print("[+] Количество запросов в норме")
          PY

  # =========================================================
  # 4. ПУБЛИКАЦИЯ
  # =========================================================
  publish-queries:
    name: 4 · Публикация
    runs-on: ubuntu-latest
    needs:
      - generate-queries
      - validate-queries
    if: always() && needs.generate-queries.result == 'success' && (needs.validate-queries.result == 'success' || needs.validate-queries.result == 'skipped') && env.DRY_RUN != '1' && env.COMMIT_GENERATED == '1'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download generated queries
        uses: actions/download-artifact@v4
        with:
          name: generated-queries
          path: generated-publish

      - name: Copy files to .github/generated/
        run: |
          set -euo pipefail

          mkdir -p .github/generated

          if [[ -d generated-publish ]]; then
            cp -a generated-publish/. .github/generated/ || true
          fi

          echo "[*] Файлы после копирования:"
          ls -lah .github/generated/ || true

      - name: Commit and push generated queries
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${GITHUB_REF_NAME}" || true

          git add .github/generated/ || true

          if git diff --staged --quiet; then
            echo "[*] Нет изменений для коммита"
          else
            git commit -m "chore(queries): auto-generate search queries [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
            echo "[+] Запросы закоммичены"
          fi

  # =========================================================
  # 5. ФИНАЛЬНЫЙ ОТЧЁТ
  # =========================================================
  report:
    name: 5 · Финальный отчёт
    runs-on: ubuntu-latest
    needs:
      - generate-queries
      - validate-queries
      - publish-queries
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download generated queries for report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: generated-queries
          path: report-queries

      - name: Print report
        run: |
          echo "=================================================="
          echo " Search Query Generator завершён"
          echo "=================================================="

          FILE="report-queries/queries.json"

          if [[ ! -f "$FILE" ]]; then
            echo "[!] queries.json не найден в артефактах"
            exit 0
          fi

          python <<PY
          import json
          import sys

          path = "$FILE"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              summary = data.get("summary", {})
              adaptive = data.get("adaptive_terms", [])

              print(f"Сгенерировано: {data.get('generated_at')}")
              print(f"Цель: {data.get('target') or '<не указана>'}")
              print(f"Адаптивных терминов: {len(adaptive)}")

              print("\nСводка:")
              for key, value in summary.items():
                  print(f"  - {key}: {value}")

              total = sum(summary.values())
              print(f"\nВсего запросов: {total}")

              print("\nТоп-20 адаптивных терминов:")
              print(", ".join(adaptive[:20]) if adaptive else "<нет>")

          except Exception as e:
              print(f"[!] Ошибка отчёта: {e}")
          PY

          echo "=================================================="

      - name: Write to summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # ✅ Search Query Generator Complete

          ## 📦 Что было сделано

          - ✅ Сгенерированы поисковые запросы для всех категорий
          - ✅ Адаптивная генерация на основе найденных данных
          - ✅ Валидация синтаксиса запросов
          - ✅ Сохранение в нескольких форматах (JSON, YAML, TXT, matrix)

          ## 📊 Категории запросов

          | Категория | Типы запросов |
          |-----------|---------------|
          | Подписки | repo, code, topic, gitverse |
          | ТГ прокси | repo, code, gitverse |
          | Утилиты | repo, code, topic, gitverse |
          | Целевые | смешанные (если указана цель) |

          ## 💡 Использование

          Запросы можно использовать в других workflow через:

```yaml
          strategy:
            matrix:
              include: ${{ fromJson(needs.load_queries.outputs.matrix) }}
```

          Или читать напрямую из файлов: