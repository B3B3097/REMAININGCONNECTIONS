name: 02 | TG Proxy Discovery & Health Check

on:
  schedule:
    # Каждый час в 35 минут
    - cron: "35 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: не коммитить результаты"
        required: false
        type: boolean
        default: false

      include_gitverse:
        description: "Искать также в Gitverse"
        required: false
        type: boolean
        default: true

      max_search_per_query:
        description: "Сколько результатов поиска брать на один запрос"
        required: false
        type: string
        default: "60"

      max_fetch_candidates:
        description: "Сколько файлов/репозиториев попробовать скачать и распарсить"
        required: false
        type: string
        default: "300"

      max_check_proxies:
        description: "Сколько уникальных прокси проверять"
        required: false
        type: string
        default: "500"

      check_timeout:
        description: "Таймаут проверки одного прокси в секундах"
        required: false
        type: string
        default: "4"

      concurrency_limit:
        description: "Сколько прокси одновременно проверять"
        required: false
        type: string
        default: "40"

concurrency:
  group: tg-proxy-discovery
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write

env:
  PYTHON_VERSION: "3.11"
  OUTPUT_DIR: "data"
  TG_PROXY_OUTPUT: "data/tg_proxies_found.json"
  GITVERSE_BASE: "https://gitverse.ru"

  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

  MAX_SEARCH_PER_QUERY: ${{ github.event.inputs.max_search_per_query || '60' }}
  MAX_FETCH_CANDIDATES: ${{ github.event.inputs.max_fetch_candidates || '300' }}
  MAX_CHECK_PROXIES: ${{ github.event.inputs.max_check_proxies || '500' }}
  CHECK_TIMEOUT: ${{ github.event.inputs.check_timeout || '4' }}
  CONCURRENCY_LIMIT: ${{ github.event.inputs.concurrency_limit || '40' }}

  DRY_RUN: ${{ github.event.inputs.dry_run == true && '1' || '0' }}
  INCLUDE_GITVERSE: ${{ github.event.inputs.include_gitverse == false && '0' || '1' }}

  USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 NetWatchTGProxyBot/1.0"

defaults:
  run:
    shell: bash

jobs:
  # =========================================================
  # 1. Подготовка
  # =========================================================
  prepare:
    name: Prepare TG proxy pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create working directories
        run: |
          mkdir -p raw
          mkdir -p candidates
          mkdir -p extracted
          mkdir -p checked
          mkdir -p "${OUTPUT_DIR}"

      - name: Write run metadata
        run: |
          python - <<'PY'
          import json
          import datetime
          import os

          payload = {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "workflow": "${{ github.workflow }}",
              "repository": "${{ github.repository }}",
              "actor": "${{ github.actor }}",
              "event_name": "${{ github.event_name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
              "max_search_per_query": os.getenv("MAX_SEARCH_PER_QUERY", "60"),
              "max_fetch_candidates": os.getenv("MAX_FETCH_CANDIDATES", "300"),
              "max_check_proxies": os.getenv("MAX_CHECK_PROXIES", "500"),
              "check_timeout": os.getenv("CHECK_TIMEOUT", "4"),
              "concurrency_limit": os.getenv("CONCURRENCY_LIMIT", "40"),
              "include_gitverse": os.getenv("INCLUDE_GITVERSE", "1") == "1",
              "dry_run": os.getenv("DRY_RUN", "0") == "1",
          }

          os.makedirs("raw", exist_ok=True)

          with open("raw/tg_proxy_run_metadata.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print("TG proxy run metadata saved")
          PY

      - name: Upload prepare metadata
        uses: actions/upload-artifact@v4
        with:
          name: tg-proxy-prepare-metadata
          path: raw/tg_proxy_run_metadata.json
          if-no-files-found: error
          retention-days: 7

  # =========================================================
  # 2. Поиск GitHub репозиториев по ключевым словам
  # =========================================================
  search-github-keywords:
    name: GH keyword search
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: mtproto
            query: "mtproto OR mtproxy"
            code_query: "mtproto OR mtproxy OR tg://proxy OR t.me/proxy"

          - slug: mtproxy
            query: "mtproxy OR mtproxy-secret"
            code_query: "mtproxy OR secret OR tg://proxy"

          - slug: telegram-proxy
            query: "telegram proxy OR telegram-proxy"
            code_query: "telegram proxy OR tg://proxy OR t.me/proxy"

          - slug: tg-proxy
            query: "tg proxy OR tg-proxy"
            code_query: "tg://proxy OR t.me/proxy OR tg-proxy"

          - slug: tme-proxy
            query: "t.me proxy OR tme proxy"
            code_query: "t.me/proxy OR tg://proxy"

          - slug: mtproto-secret
            query: "mtproto secret OR mtproxy secret"
            code_query: "secret OR mtproto OR mtproxy"

          - slug: dd-secret
            query: "dd secret OR dd mtproxy"
            code_query: "dd OR secret OR mtproxy"

          - slug: proxy-telegram
            query: "proxy telegram OR proxy-telegram"
            code_query: "tg://proxy OR t.me/proxy OR telegram"

          - slug: tg-mtproto
            query: "tg mtproto OR telegram mtproto"
            code_query: "tg://proxy OR mtproto OR mtproxy"

          - slug: mtproto-list
            query: "mtproto list OR mtproxy list"
            code_query: "mtproto OR mtproxy OR list OR proxy"

          - slug: tg-proxy-list
            query: "tg proxy list OR telegram proxy list"
            code_query: "tg://proxy OR t.me/proxy OR list"

          - slug: free-tg-proxy
            query: "free tg proxy OR free telegram proxy"
            code_query: "free OR tg://proxy OR t.me/proxy"

          - slug: tg-proxy-server
            query: "tg proxy server OR telegram proxy server"
            code_query: "server OR port OR secret OR tg://proxy"

          - slug: mtproto-endpoint
            query: "mtproto endpoint OR mtproxy endpoint"
            code_query: "endpoint OR server OR port OR secret"

          - slug: tg-proxies
            query: "tg proxies OR telegram proxies"
            code_query: "tg://proxy OR t.me/proxy OR proxies"

          - slug: proxy-for-telegram
            query: "proxy for telegram OR proxies for telegram"
            code_query: "telegram OR proxy OR tg://proxy"

          - slug: mtproxy-config
            query: "mtproxy config OR mtproto config"
            code_query: "config OR mtproxy OR mtproto OR secret"

          - slug: tg-mtproxy
            query: "tg mtproxy OR telegram mtproxy"
            code_query: "mtproxy OR tg://proxy OR t.me/proxy"

          - slug: mtproto-relay
            query: "mtproto relay OR mtproxy relay"
            code_query: "relay OR mtproto OR proxy"

          - slug: telegram-mirror-proxy
            query: "telegram mirror proxy OR telegram mirror"
            code_query: "telegram OR mirror OR proxy"

          - slug: anti-block-tg
            query: "anti block telegram OR anti zapret telegram"
            code_query: "telegram OR proxy OR tg://proxy"

          - slug: remaining-tg
            query: "remainingconnections OR remain connection"
            code_query: "remainingconnections OR stay connected OR tg://proxy"

          - slug: ru-tg-proxy
            query: "телеграм прокси или прокси телеграм"
            code_query: "телеграм OR прокси OR tg://proxy"

          - slug: ru-tg-mtproto
            query: "мтпрокси или мтпрото"
            code_query: "мтпрокси OR мтпрото OR tg://proxy"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install utilities
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Search GitHub repositories for ${{ matrix.slug }}
        env:
          QUERY: ${{ matrix.query }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail

          mkdir -p raw

          OUT="raw/tg_github_repos_${SLUG}.jsonl"
          API_OUT="raw/tg_github_repos_api_${SLUG}.json"
          : > "${OUT}"

          echo "[*] Searching GitHub repositories"
          echo "[*] Query: ${QUERY}"

          FULL_QUERY="${QUERY} fork:true archived:false"

          if ! gh api -X GET search/repositories \
            -f q="${FULL_QUERY}" \
            -f per_page="${MAX_SEARCH_PER_QUERY}" \
            -f sort=updated \
            -f order=desc > "${API_OUT}"; then
            echo '{"items":[]}' > "${API_OUT}"
          fi

          jq -c '.items[]? | {
            source: "github",
            kind: "repo",
            repo: .full_name,
            url: .html_url,
            path: null,
            score: .score,
            stars: .stargazers_count,
            updated_at: .updated_at,
            pushed_at: .pushed_at,
            description: .description
          } | select(.repo != null)' "${API_OUT}" >> "${OUT}" || true

          echo "[*] Repo candidates: $(wc -l < "${OUT}")"
          sleep $((RANDOM % 6 + 3))

      - name: Search GitHub code for ${{ matrix.slug }}
        env:
          CODE_QUERY: ${{ matrix.code_query }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail

          mkdir -p raw

          OUT="raw/tg_github_code_${SLUG}.jsonl"
          API_OUT="raw/tg_github_code_api_${SLUG}.json"
          : > "${OUT}"

          echo "[*] Searching GitHub code"
          echo "[*] Code query: ${CODE_QUERY}"

          if ! gh api -X GET search/code \
            -f q="${CODE_QUERY}" \
            -f per_page="${MAX_SEARCH_PER_QUERY}" > "${API_OUT}"; then
            echo '{"items":[]}' > "${API_OUT}"
          fi

          jq -c '.items[]? | {
            source: "github",
            kind: "code",
            repo: .repository.full_name,
            url: .repository.html_url,
            path: .path,
            score: .score
          } | select(.repo != null)' "${API_OUT}" >> "${OUT}" || true

          echo "[*] Code candidates: $(wc -l < "${OUT}")"
          sleep $((RANDOM % 8 + 4))

      - name: Upload search artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-search-github-keyword-${{ matrix.slug }}
          path: raw/tg_github_*_${{ matrix.slug }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================
  # 3. Поиск GitHub по точным паттернам
  # =========================================================
  search-github-exact-patterns:
    name: GH exact pattern search
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: exact-tg-proxy
            code_query: "tg://proxy"

          - slug: exact-tme-proxy
            code_query: "t.me/proxy"

          - slug: exact-https-tme-proxy
            code_query: "https://t.me/proxy"

          - slug: exact-tg-proxy-server
            code_query: "tg://proxy?server"

          - slug: exact-tme-proxy-server
            code_query: "t.me/proxy?server"

          - slug: exact-server-port-secret
            code_query: "server port secret proxy"

          - slug: exact-mtproxy-secret
            code_query: "mtproxy secret"

          - slug: exact-mtproto-secret
            code_query: "mtproto secret"

          - slug: exact-dd-secret
            code_query: "dd secret"

          - slug: exact-ee-secret
            code_query: "ee secret"

          - slug: exact-proxy-server
            code_query: "proxy?server"

          - slug: exact-proxy-port
            code_query: "proxy?port"

          - slug: exact-proxy-secret
            code_query: "proxy?secret"

          - slug: exact-tg-links
            code_query: "tg://proxy?server="

          - slug: exact-tme-links
            code_query: "https://t.me/proxy?server="

          - slug: exact-mtproto-proxy
            code_query: "mtproto proxy"

          - slug: exact-mtproxy-proxy
            code_query: "mtproxy proxy"

          - slug: exact-telegram-proxy-links
            code_query: "telegram proxy server port secret"

          - slug: exact-tg-proxy-list
            code_query: "tg proxy list"

          - slug: exact-mtproxy-list
            code_query: "mtproxy list"

          - slug: exact-mtproto-list
            code_query: "mtproto list"

          - slug: exact-proxy-for-telegram
            code_query: "proxy for telegram"

          - slug: exact-tg-free-proxy
            code_query: "free tg proxy"

          - slug: exact-tg-proxy-md
            code_query: "tg://proxy filename:.md"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install utilities
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Search GitHub exact patterns for ${{ matrix.slug }}
        env:
          CODE_QUERY: ${{ matrix.code_query }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail

          mkdir -p raw

          OUT="raw/tg_github_exact_${SLUG}.jsonl"
          API_OUT="raw/tg_github_exact_api_${SLUG}.json"
          : > "${OUT}"

          echo "[*] Searching exact pattern"
          echo "[*] Query: ${CODE_QUERY}"

          if ! gh api -X GET search/code \
            -f q="${CODE_QUERY}" \
            -f per_page="${MAX_SEARCH_PER_QUERY}" > "${API_OUT}"; then
            echo '{"items":[]}' > "${API_OUT}"
          fi

          jq -c '.items[]? | {
            source: "github",
            kind: "exact",
            repo: .repository.full_name,
            url: .repository.html_url,
            path: .path,
            score: .score
          } | select(.repo != null)' "${API_OUT}" >> "${OUT}" || true

          echo "[*] Exact candidates: $(wc -l < "${OUT}")"
          sleep $((RANDOM % 9 + 5))

      - name: Upload exact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-search-github-${{ matrix.slug }}
          path: raw/tg_github_exact_${{ matrix.slug }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================
  # 4. Поиск GitHub по именам файлов
  # =========================================================
  search-github-files:
    name: GH filename search
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: file-mtproxy-txt
            code_query: "tg OR proxy OR mtproto filename:mtproxy.txt"

          - slug: file-mtproxy-list-txt
            code_query: "tg OR proxy OR mtproto filename:mtproxy-list.txt"

          - slug: file-mtproto-txt
            code_query: "tg OR proxy OR mtproto filename:mtproto.txt"

          - slug: file-tg-proxy-txt
            code_query: "tg OR proxy OR telegram filename:tg-proxy.txt"

          - slug: file-tg-proxies-txt
            code_query: "tg OR proxy OR telegram filename:tg-proxies.txt"

          - slug: file-telegram-proxy-txt
            code_query: "tg OR proxy OR telegram filename:telegram-proxy.txt"

          - slug: file-telegram-proxies-txt
            code_query: "tg OR proxy OR telegram filename:telegram-proxies.txt"

          - slug: file-proxy-txt
            code_query: "tg OR proxy OR mtproto filename:proxy.txt"

          - slug: file-proxies-txt
            code_query: "tg OR proxy OR mtproto filename:proxies.txt"

          - slug: file-proxy-list-txt
            code_query: "tg OR proxy OR mtproto filename:proxy-list.txt"

          - slug: file-tg-txt
            code_query: "tg OR proxy OR mtproto filename:tg.txt"

          - slug: file-tg-md
            code_query: "tg://proxy OR t.me/proxy filename:tg.md"

          - slug: file-proxy-md
            code_query: "tg://proxy OR t.me/proxy filename:proxy.md"

          - slug: file-proxies-md
            code_query: "tg://proxy OR t.me/proxy filename:proxies.md"

          - slug: file-mtproxy-md
            code_query: "tg://proxy OR t.me/proxy OR mtproxy filename:mtproxy.md"

          - slug: file-mtproto-md
            code_query: "tg://proxy OR t.me/proxy OR mtproto filename:mtproto.md"

          - slug: file-readme-md
            code_query: "tg://proxy OR t.me/proxy OR mtproxy filename:README.md"

          - slug: file-list-txt
            code_query: "tg OR proxy OR mtproto filename:list.txt"

          - slug: file-free-tg-proxy-txt
            code_query: "tg OR proxy OR telegram filename:free-tg-proxy.txt"

          - slug: file-tg-proxy-json
            code_query: "tg OR proxy OR mtproto filename:tg-proxy.json"

          - slug: file-mtproxy-json
            code_query: "tg OR proxy OR mtproto filename:mtproxy.json"

          - slug: file-mtproto-json
            code_query: "tg OR proxy OR mtproto filename:mtproto.json"

          - slug: file-proxy-yaml
            code_query: "tg OR proxy OR mtproto filename:proxy.yaml"

          - slug: file-proxies-yaml
            code_query: "tg OR proxy OR mtproto filename:proxies.yaml"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install utilities
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Search GitHub filenames for ${{ matrix.slug }}
        env:
          CODE_QUERY: ${{ matrix.code_query }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail

          mkdir -p raw

          OUT="raw/tg_github_files_${SLUG}.jsonl"
          API_OUT="raw/tg_github_files_api_${SLUG}.json"
          : > "${OUT}"

          echo "[*] Searching filename pattern"
          echo "[*] Query: ${CODE_QUERY}"

          if ! gh api -X GET search/code \
            -f q="${CODE_QUERY}" \
            -f per_page="${MAX_SEARCH_PER_QUERY}" > "${API_OUT}"; then
            echo '{"items":[]}' > "${API_OUT}"
          fi

          jq -c '.items[]? | {
            source: "github",
            kind: "file",
            repo: .repository.full_name,
            url: .repository.html_url,
            path: .path,
            score: .score
          } | select(.repo != null)' "${API_OUT}" >> "${OUT}" || true

          echo "[*] File candidates: $(wc -l < "${OUT}")"
          sleep $((RANDOM % 9 + 5))

      - name: Upload filename artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-search-github-${{ matrix.slug }}
          path: raw/tg_github_files_${{ matrix.slug }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================
  # 5. Поиск Gitverse
  # =========================================================
  search-gitverse-keywords:
    name: Gitverse TG proxy search
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 25
    continue-on-error: true
    if: env.INCLUDE_GITVERSE == '1'

    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: gv-mtproto
            query: "mtproto"

          - slug: gv-mtproxy
            query: "mtproxy"

          - slug: gv-telegram-proxy
            query: "telegram proxy"

          - slug: gv-tg-proxy
            query: "tg proxy"

          - slug: gv-tg-proxies
            query: "tg proxies"

          - slug: gv-mtproto-secret
            query: "mtproto secret"

          - slug: gv-mtproxy-secret
            query: "mtproxy secret"

          - slug: gv-proxy-list
            query: "proxy list"

          - slug: gv-tg-list
            query: "tg list"

          - slug: gv-telegram-proxies
            query: "telegram proxies"

          - slug: gv-free-tg-proxy
            query: "free tg proxy"

          - slug: gv-ru-tg-proxy
            query: "телеграм прокси"

          - slug: gv-ru-mtproxy
            query: "мтпрокси"

          - slug: gv-ru-mtproto
            query: "мтпрото"

          - slug: gv-remaining
            query: "remainingconnections"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Search Gitverse for ${{ matrix.slug }}
        env:
          QUERY: ${{ matrix.query }}
          SLUG: ${{ matrix.slug }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import requests

          query = os.getenv("QUERY", "")
          slug = os.getenv("SLUG", "unknown")
          base = os.getenv("GITVERSE_BASE", "https://gitverse.ru")
          user_agent = os.getenv("USER_AGENT", "NetWatchTGProxyBot/1.0")

          out_path = f"raw/tg_gitverse_{slug}.jsonl"
          os.makedirs("raw", exist_ok=True)

          headers = {
              "User-Agent": user_agent,
              "Accept": "application/json",
          }

          results = []

          endpoints = [
              f"{base}/api/v1/repos/search",
              f"{base}/api/v1/repositories/search",
          ]

          params = {
              "q": query,
              "limit": 50,
          }

          for endpoint in endpoints:
              try:
                  print(f"[*] Trying endpoint: {endpoint}")
                  r = requests.get(endpoint, params=params, headers=headers, timeout=25)
                  print(f"[*] Status: {r.status_code}")

                  if r.status_code != 200:
                      continue

                  data = r.json()

                  items = []
                  if isinstance(data, dict):
                      items = data.get("data", []) or data.get("items", []) or data.get("repos", [])
                  elif isinstance(data, list):
                      items = data

                  for item in items:
                      full_name = item.get("full_name") or item.get("name")
                      html_url = item.get("html_url") or item.get("url")

                      if not full_name:
                          continue

                      if html_url and not html_url.startswith("http"):
                          html_url = f"{base}/{full_name}"

                      results.append({
                          "source": "gitverse",
                          "kind": "repo",
                          "repo": full_name,
                          "url": html_url,
                          "path": None,
                          "score": 1.0,
                          "updated_at": item.get("updated_at"),
                          "description": item.get("description"),
                      })

                  if results:
                      break

              except Exception as e:
                  print(f"[!] Gitverse request failed: {e}")
                  time.sleep(2)

          with open(out_path, "w", encoding="utf-8") as f:
              for row in results:
                  f.write(json.dumps(row, ensure_ascii=False) + "\n")

          print(f"[*] Saved {len(results)} Gitverse TG proxy candidates to {out_path}")
          time.sleep(2)
          PY

      - name: Upload Gitverse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-search-gitverse-${{ matrix.slug }}
          path: raw/tg_gitverse_${{ matrix.slug }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================
  # 6. Сбор всех кандидатов
  # =========================================================
  collect-candidates:
    name: Collect TG proxy candidates
    runs-on: ubuntu-latest
    needs:
      - search-github-keywords
      - search-github-exact-patterns
      - search-github-files
      - search-gitverse-keywords
    if: always()
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p raw
          mkdir -p candidates

      - name: Download search artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: tg-search-*
          path: candidates
          merge-multiple: true

      - name: Normalize candidates
        run: |
          python - <<'PY'
          import os
          import json
          import glob

          files = glob.glob("candidates/**/*.jsonl", recursive=True)
          files += glob.glob("raw/**/*.jsonl", recursive=True)

          out_path = "raw/tg_candidates.jsonl"

          seen = set()
          total = 0
          written = 0

          with open(out_path, "w", encoding="utf-8") as out:
              for file_path in sorted(files):
                  try:
                      with open(file_path, "r", encoding="utf-8") as f:
                          for line in f:
                              line = line.strip()
                              if not line:
                                  continue

                              total += 1

                              try:
                                  obj = json.loads(line)
                              except Exception:
                                  continue

                              repo = obj.get("repo")
                              source = obj.get("source")

                              if not repo or not source:
                                  continue

                              path = obj.get("path") or ""
                              key = f"{source}::{repo.lower()}::{path.lower()}"

                              if key in seen:
                                  continue

                              seen.add(key)

                              normalized = {
                                  "source": source,
                                  "kind": obj.get("kind", "repo"),
                                  "repo": repo,
                                  "url": obj.get("url"),
                                  "path": path or None,
                                  "score": obj.get("score", 0),
                                  "stars": obj.get("stars"),
                                  "updated_at": obj.get("updated_at"),
                                  "description": obj.get("description"),
                              }

                              out.write(json.dumps(normalized, ensure_ascii=False) + "\n")
                              written += 1
                  except Exception as e:
                      print(f"[!] Failed to read {file_path}: {e}")

          print(f"[*] Total raw TG candidates: {total}")
          print(f"[*] Unique normalized TG candidates: {written}")
          print(f"[*] Saved to {out_path}")
          PY

      - name: Upload normalized candidates
        uses: actions/upload-artifact@v4
        with:
          name: tg-candidates
          path: raw/tg_candidates.jsonl
          if-no-files-found: warn
          retention-days: 7

  # =========================================================
  # 7. Скачивание файлов и извлечение ТГ прокси
  # =========================================================
  fetch-and-extract:
    name: Fetch files and extract proxies
    runs-on: ubuntu-latest
    needs: collect-candidates
    if: always()
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create directories
        run: |
          mkdir -p raw
          mkdir -p extracted

      - name: Download candidates
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tg-candidates
          path: raw

      - name: Extract TG proxies from files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITVERSE_BASE: ${{ env.GITVERSE_BASE }}
          MAX_FETCH_CANDIDATES: ${{ env.MAX_FETCH_CANDIDATES }}
          USER_AGENT: ${{ env.USER_AGENT }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import time
          import random
          import requests
          from urllib.parse import urlparse, parse_qs

          GITHUB_API = "https://api.github.com"
          GITVERSE_BASE = os.getenv("GITVERSE_BASE", "https://gitverse.ru")
          TOKEN = os.getenv("GITHUB_TOKEN", "")
          USER_AGENT = os.getenv("USER_AGENT", "NetWatchTGProxyBot/1.0")
          MAX_FETCH_CANDIDATES = int(os.getenv("MAX_FETCH_CANDIDATES", "300"))

          HEADERS = {
              "Accept": "application/vnd.github+json",
              "User-Agent": USER_AGENT,
          }

          if TOKEN:
              HEADERS["Authorization"] = f"Bearer {TOKEN}"

          session = requests.Session()
          session.headers.update(HEADERS)

          TG_PROXY_RE = re.compile(
              r"(?:tg://proxy|https?://t\.me/proxy)\?[^\s\)\]\"'<>]+",
              re.IGNORECASE,
          )

          COMMON_TG_FILES = [
              "mtproxy.txt",
              "mtproxy-list.txt",
              "mtproto.txt",
              "tg-proxy.txt",
              "tg-proxies.txt",
              "telegram-proxy.txt",
              "telegram-proxies.txt",
              "proxy.txt",
              "proxies.txt",
              "proxy-list.txt",
              "list.txt",
              "tg.txt",
              "tg.md",
              "proxy.md",
              "proxies.md",
              "mtproxy.md",
              "mtproto.md",
              "README.md",
              "README.RU.md",
              "readme.md",
              "free-tg-proxy.txt",
              "tg-proxy.json",
              "mtproxy.json",
              "mtproto.json",
              "proxy.yaml",
              "proxies.yaml",
          ]

          branch_cache = {}
          proxies = {}

          def sleep_random(min_seconds=1, max_seconds=3):
              time.sleep(min_seconds + random.random() * (max_seconds - min_seconds))

          def fetch_json(url, params=None):
              for attempt in range(3):
                  try:
                      r = session.get(url, params=params, timeout=25)

                      if r.status_code == 200:
                          return r.json()

                      if r.status_code in (403, 429):
                          retry_after = r.headers.get("Retry-After")
                          wait = int(retry_after) if retry_after and retry_after.isdigit() else 6
                          print(f"[!] Rate limit? {r.status_code} for {url}, waiting {wait}s")
                          time.sleep(wait)
                          continue

                      if 500 <= r.status_code < 600:
                          time.sleep(2 + attempt)
                          continue

                      return None
                  except Exception as e:
                      print(f"[!] fetch_json error {url}: {e}")
                      time.sleep(2 + attempt)

              return None

          def fetch_text(url):
              try:
                  r = session.get(url, timeout=25)
                  if r.status_code == 200 and r.text and len(r.text.strip()) > 0:
                      return r.text
                  return None
              except Exception as e:
                  print(f"[!] fetch_text error {url}: {e}")
                  return None

          def get_github_default_branch(repo):
              if repo in branch_cache:
                  return branch_cache[repo]

              data = fetch_json(f"{GITHUB_API}/repos/{repo}")
              branch = None

              if data:
                  branch = data.get("default_branch")

              if not branch:
                  branch = "main"

              branch_cache[repo] = branch
              return branch

          def get_gitverse_default_branch(repo):
              if repo in branch_cache:
                  return branch_cache[repo]

              data = fetch_json(f"{GITVERSE_BASE}/api/v1/repos/{repo}")
              branch = None

              if data:
                  branch = data.get("default_branch")

              if not branch:
                  branch = "main"

              branch_cache[repo] = branch
              return branch

          def parse_tg_url(url):
              try:
                  parsed = urlparse(url)
                  params = parse_qs(parsed.query)

                  server = params.get("server", [None])[0]
                  port = params.get("port", [None])[0]
                  secret = params.get("secret", [None])[0]

                  if not server or not port or not secret:
                      return None

                  port = int(port)

                  if port <= 0 or port > 65535:
                      return None

                  if not re.fullmatch(r"[a-zA-Z0-9.-]{3,255}", server):
                      return None

                  secret = secret.strip()

                  if not re.fullmatch(r"[0-9a-fA-F]{32,128}", secret):
                      return None

                  return {
                      "server": server,
                      "port": port,
                      "secret": secret,
                  }
              except Exception:
                  return None

          def extract_from_text(text, source, repo, path, candidate_url):
              if not text:
                  return 0

              found = 0
              matches = TG_PROXY_RE.findall(text)

              for match in matches:
                  parsed = parse_tg_url(match)

                  if not parsed:
                      continue

                  key = f"{parsed['server']}:{parsed['port']}:{parsed['secret']}"

                  tg_url = (
                      f"tg://proxy?server={parsed['server']}"
                      f"&port={parsed['port']}"
                      f"&secret={parsed['secret']}"
                  )

                  tme_url = (
                      f"https://t.me/proxy?server={parsed['server']}"
                      f"&port={parsed['port']}"
                      f"&secret={parsed['secret']}"
                  )

                  source_ref = {
                      "source": source,
                      "repo": repo,
                      "path": path,
                      "url": candidate_url,
                  }

                  if key not in proxies:
                      proxies[key] = {
                          "server": parsed["server"],
                          "port": parsed["port"],
                          "secret": parsed["secret"],
                          "protocol": "mtproto",
                          "tg_url": tg_url,
                          "tme_url": tme_url,
                          "sources": [source_ref],
                      }
                  else:
                      if len(proxies[key]["sources"]) < 8:
                          proxies[key]["sources"].append(source_ref)

                  found += 1

              return found

          def fetch_github_paths(repo, path=None):
              branch = get_github_default_branch(repo)
              paths = []

              if path:
                  paths.append(path)
              else:
                  paths.extend(COMMON_TG_FILES)

              for p in paths[:20]:
                  raw_url = f"https://raw.githubusercontent.com/{repo}/{branch}/{p}"
                  text = fetch_text(raw_url)

                  if text:
                      yield p, raw_url, text

                  sleep_random(0.5, 1.5)

          def fetch_gitverse_paths(repo, path=None):
              branch = get_gitverse_default_branch(repo)
              paths = []

              if path:
                  paths.append(path)
              else:
                  paths.extend(COMMON_TG_FILES)

              branches = [branch, "main", "master"]

              for b in branches:
                  for p in paths[:12]:
                      raw_candidates = [
                          f"{GITVERSE_BASE}/{repo}/raw/branch/{b}/{p}",
                          f"{GITVERSE_BASE}/{repo}/raw/{b}/{p}",
                          f"{GITVERSE_BASE}/{repo}/raw/{p}",
                      ]

                      for raw_url in raw_candidates:
                          text = fetch_text(raw_url)

                          if text:
                              yield p, raw_url, text
                              break

                      sleep_random(0.5, 1.5)

          candidates = []
          candidate_file = "raw/tg_candidates.jsonl"

          if os.path.exists(candidate_file):
              with open(candidate_file, "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue

                      try:
                          candidates.append(json.loads(line))
                      except Exception:
                          continue
          else:
              print("[!] Candidate file not found")

          print(f"[*] Loaded TG candidates: {len(candidates)}")

          # Сначала файлы, потом репозитории без пути
          candidates.sort(
              key=lambda x: (
                  x.get("source") != "github",
                  x.get("path") is None,
                  -(x.get("score") or 0),
              )
          )

          processed = 0
          total_found = 0

          for candidate in candidates:
              if processed >= MAX_FETCH_CANDIDATES:
                  print(f"[*] Reached MAX_FETCH_CANDIDATES: {MAX_FETCH_CANDIDATES}")
                  break

              source = candidate.get("source")
              repo = candidate.get("repo")
              path = candidate.get("path")
              candidate_url = candidate.get("url")

              if not source or not repo:
                  continue

              processed += 1
              print(f"[*] Processing {source}:{repo}:{path or '<no path>'}")

              try:
                  if source == "github":
                      iterator = fetch_github_paths(repo, path)
                  elif source == "gitverse":
                      iterator = fetch_gitverse_paths(repo, path)
                  else:
                      iterator = []

                  for file_path, raw_url, text in iterator:
                      found = extract_from_text(
                          text=text,
                          source=source,
                          repo=repo,
                          path=file_path,
                          candidate_url=raw_url,
                      )

                      total_found += found

                      if found:
                          print(f"[+] Found {found} TG proxy mentions in {raw_url}")

              except Exception as e:
                  print(f"[!] Failed processing {repo}: {e}")

              sleep_random(1, 2)

          os.makedirs("extracted", exist_ok=True)

          out_jsonl = "extracted/tg_proxies_extracted.jsonl"
          out_json = "extracted/tg_proxies_extracted.json"

          proxy_list = list(proxies.values())

          with open(out_jsonl, "w", encoding="utf-8") as f:
              for item in proxy_list:
                  f.write(json.dumps(item, ensure_ascii=False) + "\n")

          payload = {
              "extracted_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "generator": "tg-proxy-discovery.yml",
              "processed_candidates": processed,
              "unique_proxies": len(proxy_list),
              "raw_mentions_found": total_found,
              "proxies": proxy_list,
          }

          with open(out_json, "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print(f"[*] Processed candidates: {processed}")
          print(f"[*] Raw TG proxy mentions: {total_found}")
          print(f"[*] Unique proxies: {len(proxy_list)}")
          print(f"[*] Saved extracted data to {out_jsonl} and {out_json}")
          PY

      - name: Upload extracted proxies
        uses: actions/upload-artifact@v4
        with:
          name: tg-proxies-extracted
          path: extracted/tg_proxies_extracted.*
          if-no-files-found: warn
          retention-days: 14

  # =========================================================
  # 8. Проверка ТГ прокси
  # =========================================================
  check-proxies:
    name: Check TG proxies
    runs-on: ubuntu-latest
    needs: fetch-and-extract
    if: always()
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create directories
        run: |
          mkdir -p extracted
          mkdir -p checked
          mkdir -p "${OUTPUT_DIR}"

      - name: Download extracted proxies
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tg-proxies-extracted
          path: extracted

      - name: Run proxy health checks
        env:
          MAX_CHECK_PROXIES: ${{ env.MAX_CHECK_PROXIES }}
          CHECK_TIMEOUT: ${{ env.CHECK_TIMEOUT }}
          CONCURRENCY_LIMIT: ${{ env.CONCURRENCY_LIMIT }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import time
          import datetime
          import socket

          MAX_CHECK_PROXIES = int(os.getenv("MAX_CHECK_PROXIES", "500"))
          CHECK_TIMEOUT = float(os.getenv("CHECK_TIMEOUT", "4"))
          CONCURRENCY_LIMIT = int(os.getenv("CONCURRENCY_LIMIT", "40"))

          INPUT_JSON = "extracted/tg_proxies_extracted.json"
          OUTPUT_JSON = "checked/tg_proxies_checked.json"
          FINAL_JSON = os.getenv("TG_PROXY_OUTPUT", "data/tg_proxies_found.json")

          def now_iso():
              return (
                  datetime.datetime.now(datetime.timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z")
              )

          def load_proxies():
              if not os.path.exists(INPUT_JSON):
                  print(f"[!] Input file not found: {INPUT_JSON}")
                  return []

              try:
                  with open(INPUT_JSON, "r", encoding="utf-8") as f:
                      payload = json.load(f)

                  proxies = payload.get("proxies", [])
                  print(f"[*] Loaded proxies: {len(proxies)}")
                  return proxies
              except Exception as e:
                  print(f"[!] Failed to load proxies: {e}")
                  return []

          def classify_secret(secret):
              if not secret:
                  return "unknown"

              s = secret.lower()

              if s.startswith("dd"):
                  return "fake_tls_or_padding"
              if s.startswith("ee"):
                  return "media_or_special"
              if len(s) == 32 or len(s) == 64:
                  return "hex"

              return "other"

          async def check_one(proxy, semaphore):
              async with semaphore:
                  server = proxy.get("server")
                  port = proxy.get("port")
                  secret = proxy.get("secret")

                  result = {
                      "id": None,
                      "host": server,
                      "server": server,
                      "port": port,
                      "secret": secret,
                      "protocol": "MTProto",
                      "tg_url": proxy.get("tg_url"),
                      "tme_url": proxy.get("tme_url"),
                      "sources": proxy.get("sources", []),
                      "secret_type": classify_secret(secret),
                      "checked_at": now_iso(),
                      "dns_ok": False,
                      "tcp_open": False,
                      "latency_ms": None,
                      "ping": None,
                      "status": "offline",
                      "country": None,
                      "errors": [],
                  }

                  if not server or not port:
                      result["errors"].append("invalid_server_or_port")
                      return result

                  try:
                      port = int(port)
                      result["port"] = port
                  except Exception:
                      result["errors"].append("invalid_port")
                      return result

                  # DNS check
                  try:
                      infos = await asyncio.get_running_loop().getaddrinfo(
                          server,
                          port,
                          proto=socket.IPPROTO_TCP,
                      )

                      if not infos:
                          result["errors"].append("dns_no_records")
                          return result

                      result["dns_ok"] = True
                  except Exception as e:
                      result["errors"].append(f"dns_error:{e.__class__.__name__}")
                      return result

                  # TCP check with retries
                  retries = 2

                  for attempt in range(retries):
                      start = time.perf_counter()

                      try:
                          reader, writer = await asyncio.wait_for(
                              asyncio.open_connection(server, port),
                              timeout=CHECK_TIMEOUT,
                          )

                          latency_ms = round((time.perf_counter() - start) * 1000, 2)

                          result["tcp_open"] = True
                          result["latency_ms"] = latency_ms
                          result["ping"] = latency_ms
                          result["status"] = "online"

                          try:
                              writer.close()
                              await writer.wait_closed()
                          except Exception:
                              pass

                          break

                      except asyncio.TimeoutError:
                          result["errors"].append(f"tcp_timeout_attempt_{attempt + 1}")
                      except Exception as e:
                          result["errors"].append(f"tcp_error:{e.__class__.__name__}")

                      await asyncio.sleep(0.25)

                  return result

          async def main():
              proxies = load_proxies()

              if not proxies:
                  payload = {
                      "generated_at": now_iso(),
                      "generator": "tg-proxy-discovery.yml",
                      "checked_count": 0,
                      "online_count": 0,
                      "offline_count": 0,
                      "dns_fail_count": 0,
                      "avg_latency_ms": None,
                      "proxies": [],
                  }

                  os.makedirs("checked", exist_ok=True)
                  os.makedirs(os.path.dirname(FINAL_JSON), exist_ok=True)

                  with open(OUTPUT_JSON, "w", encoding="utf-8") as f:
                      json.dump(payload, f, ensure_ascii=False, indent=2)

                  with open(FINAL_JSON, "w", encoding="utf-8") as f:
                      json.dump(payload, f, ensure_ascii=False, indent=2)

                  print("[!] No proxies to check. Wrote empty result files.")
                  return

              # Сортируем: у кого больше источников, те приоритетнее
              proxies.sort(
                  key=lambda x: len(x.get("sources", [])),
                  reverse=True,
              )

              proxies = proxies[:MAX_CHECK_PROXIES]

              print(f"[*] Checking {len(proxies)} proxies")
              print(f"[*] Timeout: {CHECK_TIMEOUT}s")
              print(f"[*] Concurrency: {CONCURRENCY_LIMIT}")

              semaphore = asyncio.Semaphore(CONCURRENCY_LIMIT)

              tasks = [
                  check_one(proxy, semaphore)
                  for proxy in proxies
              ]

              results = await asyncio.gather(*tasks, return_exceptions=False)

              # Проставляем ID после проверки
              for idx, item in enumerate(results, start=1):
                  item["id"] = idx

              online = [x for x in results if x["status"] == "online"]
              offline = [x for x in results if x["status"] != "online"]
              dns_fail = [x for x in results if not x["dns_ok"]]

              avg_latency = None
              if online:
                  latencies = [x["latency_ms"] for x in online if x.get("latency_ms") is not None]
                  if latencies:
                      avg_latency = round(sum(latencies) / len(latencies), 2)

              # Сортировка итога: онлайн сверху, по пингу
              results.sort(
                  key=lambda x: (
                      x["status"] != "online",
                      x["latency_ms"] if x.get("latency_ms") is not None else 999999,
                      -(len(x.get("sources", []))),
                  )
              )

              payload = {
                  "generated_at": now_iso(),
                  "generator": "tg-proxy-discovery.yml",
                  "telegram_channel": "https://t.me/REMAININGCONNECTIONS",
                  "checked_count": len(results),
                  "online_count": len(online),
                  "offline_count": len(offline),
                  "dns_fail_count": len(dns_fail),
                  "avg_latency_ms": avg_latency,
                  "check_timeout_seconds": CHECK_TIMEOUT,
                  "concurrency_limit": CONCURRENCY_LIMIT,
                  "proxies": results,
              }

              os.makedirs("checked", exist_ok=True)
              os.makedirs(os.path.dirname(FINAL_JSON), exist_ok=True)

              with open(OUTPUT_JSON, "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)

              with open(FINAL_JSON, "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)

              print("==================================================")
              print(" TG proxy check finished")
              print("==================================================")
              print(f"Checked: {len(results)}")
              print(f"Online: {len(online)}")
              print(f"Offline: {len(offline)}")
              print(f"DNS failures: {len(dns_fail)}")
              print(f"Average latency: {avg_latency}")
              print(f"Saved: {OUTPUT_JSON}")
              print(f"Saved: {FINAL_JSON}")
              print("==================================================")

          asyncio.run(main())
          PY

      - name: Upload checked proxies
        uses: actions/upload-artifact@v4
        with:
          name: tg-proxies-checked
          path: |
            checked/tg_proxies_checked.json
            data/tg_proxies_found.json
          if-no-files-found: warn
          retention-days: 14

  # =========================================================
  # 9. Публикация результата
  # =========================================================
  publish-results:
    name: Publish TG proxy results
    runs-on: ubuntu-latest
    needs: check-proxies
    if: always() && needs.check-proxies.result == 'success' && env.DRY_RUN != '1'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create directories
        run: |
          mkdir -p data
          mkdir -p downloaded

      - name: Download checked proxies
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tg-proxies-checked
          path: downloaded

      - name: Move result into data directory
        run: |
          set -euo pipefail

          FOUND_FILE="$(find downloaded -type f -name 'tg_proxies_found.json' | head -n 1 || true)"

          if [[ -z "${FOUND_FILE}" ]]; then
            echo "[!] tg_proxies_found.json not found in artifact"
            echo "[!] Creating empty placeholder"

            cat > data/tg_proxies_found.json <<'JSON'
          {
            "generated_at": "",
            "generator": "tg-proxy-discovery.yml",
            "checked_count": 0,
            "online_count": 0,
            "offline_count": 0,
            "dns_fail_count": 0,
            "avg_latency_ms": null,
            "proxies": []
          }
          JSON
          else
            cp "${FOUND_FILE}" data/tg_proxies_found.json
          fi

          echo "[*] Result file:"
          ls -lah data || true

      - name: Commit and push TG proxy data
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${GITHUB_REF_NAME}" || true

          git add data/tg_proxies_found.json || true

          if git diff --staged --quiet; then
            echo "[*] No changes to commit"
          else
            git commit -m "chore(data): update tg_proxies_found.json [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
            echo "[*] Pushed updated TG proxy data"
          fi

  # =========================================================
  # 10. Финальный отчет
  # =========================================================
  report:
    name: TG proxy report
    runs-on: ubuntu-latest
    needs:
      - collect-candidates
      - fetch-and-extract
      - check-proxies
      - publish-results
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download checked proxies for report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tg-proxies-checked
          path: tg-report-artifacts

      - name: Print short report
        run: |
          echo "=================================================="
          echo " TG Proxy Discovery & Health Check finished"
          echo "=================================================="

          FILE="$(find tg-report-artifacts -type f -name 'tg_proxies_found.json' | head -n 1 || true)"

          if [[ -z "${FILE}" ]]; then
            echo "[!] No TG proxy result file found."
            exit 0
          fi

          python - <<'PY'
          import json
          import os

          path = os.environ["FILE"]

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              print(f"Generated at: {data.get('generated_at')}")
              print(f"Checked: {data.get('checked_count')}")
              print(f"Online: {data.get('online_count')}")
              print(f"Offline: {data.get('offline_count')}")
              print(f"DNS failures: {data.get('dns_fail_count')}")
              print(f"Average latency: {data.get('avg_latency_ms')}")

              proxies = data.get("proxies", [])

              online = [x for x in proxies if x.get("status") == "online"]

              print("\nTop 10 fastest online TG proxies:")
              for proxy in online[:10]:
                  host = proxy.get("host") or proxy.get("server")
                  port = proxy.get("port")
                  ping = proxy.get("latency_ms")
                  secret_type = proxy.get("secret_type")
                  print(f"- {host}:{port} | ping: {ping} ms | secret: {secret_type}")

          except Exception as e:
              print(f"[!] Failed to print report: {e}")
          PY

          echo "=================================================="