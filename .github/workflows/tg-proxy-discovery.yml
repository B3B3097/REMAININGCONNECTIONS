      - name: Install Xray core via manager
        if: github.event.inputs.enable_xray == 'true'
        run: |
          set -euo pipefail
          echo "[+] Installing Xray core using xray_manager..."
          python scripts/xray_manager.py install --force
          echo "[+] Verifying installation..."
          xray version

