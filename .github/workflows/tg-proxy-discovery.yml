 name: TG Proxy Discovery

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      max_check:
        description: 'Max proxies to check'
        required: false
        default: '2000'
      concurrency_limit:
        description: 'Concurrency limit for validation'
        required: false
        default: '30'

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CONCURRENCY_LIMIT: >-
        ${{ github.event.inputs.concurrency_limit || '30' }}
      MAX_CHECK_PROXIES: >-
        ${{ github.event.inputs.max_check || '2000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories
        run: mkdir -p data extracted checked

      - name: Extract Telegram proxies from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[+] Extracting Telegram proxies from GitHub..."
          python scripts/extract_tg_proxies.py
          
          if [ -f extracted/tg_proxies_extracted.json ]; then
            extracted_count=$(jq '.total_extracted // 0' extracted/tg_proxies_extracted.json)
            echo "[+] Extracted ${extracted_count} proxies"
          else
            echo "[!] Warning: No proxies extracted"
            echo '{"generated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","total_extracted":0,"proxies":[]}' > extracted/tg_proxies_extracted.json
          fi

      - name: Validate extracted proxies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[+] Validating extracted Telegram proxies..."
          python scripts/check_tg_proxies.py \
            --input extracted/tg_proxies_extracted.json \
            --output checked/tg_proxies_checked.json \
            --final-output data/tg_proxies_found.json \
            --max-check ${MAX_CHECK_PROXIES} \
            --timeout 8 \
            --concurrency ${CONCURRENCY_LIMIT} \
            --enable-mtproto
          echo "[+] Validation complete."

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ extracted/ checked/
          if git diff --staged --quiet; then
            echo "[*] No changes to commit"
          else
            git commit -m "chore: update Telegram proxy data [$(date -u +%Y-%m-%d)]"
            git push
            echo "[+] Changes committed and pushed"
          fi