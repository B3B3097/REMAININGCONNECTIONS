name: TG Proxy Discovery

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      max_check:
        description: 'Max proxies to check'
        required: false
        default: '2000'
      concurrency_limit:
        description: 'Concurrency limit for validation'
        required: false
        default: '30'

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CONCURRENCY_LIMIT: >-
        ${{ github.event.inputs.concurrency_limit || '30' }}
      MAX_CHECK_PROXIES: >-
        ${{ github.event.inputs.max_check || '2000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data extracted checked

      - name: Search and extract Telegram proxies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[+] Starting Telegram proxy discovery..."
          python scripts/check_tg_proxies.py \
            --input extracted/tg_proxies_extracted.json \
            --output checked/tg_proxies_checked.json \
            --final-output data/tg_proxies_found.json \
            --max-check ${MAX_CHECK_PROXIES} \
            --timeout 8 \
            --concurrency ${CONCURRENCY_LIMIT} \
            --enable-mtproto
          echo "[+] Discovery complete."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git add data/ extracted/ checked/
          if git diff --staged --quiet; then
            echo "[*] No changes to commit."
          else
            git commit -m \
              "🔄 Auto-update: TG proxies with MTProto validation"
            git push
          fi