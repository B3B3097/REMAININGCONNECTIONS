name: TG Proxy Discovery

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      max_repos:
        description: 'Max repos to search'
        required: false
        default: '50'
      enable_xray:
        description: 'Enable Xray verification'
        required: false
        default: 'false'

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir requests pyyaml
      
      - name: Search and extract Telegram proxies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_REPOS: ${{ github.event.inputs.max_repos || '50' }}
        run: |
          python3 << 'PY'
          import json, os, re, time
          from urllib.parse import urlparse, parse_qs
          import requests

          token = os.getenv("GITHUB_TOKEN")
          max_repos = int(os.getenv("MAX_REPOS", "50"))
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}
          
          TG_PROXY_RE = re.compile(
              r"(?:tg://(?:proxy|socks)|https?://t\.me/(?:proxy|socks)|socks5?://[^\s]+|https?://(?!t\.me)[^\s]+:\d+)", 
              re.IGNORECASE
          )
          
          def parse_tg_url(url):
              try:
                  parsed = urlparse(url)
                  params = parse_qs(parsed.query)
                  scheme = parsed.scheme.lower()
                  kind = (parsed.netloc if scheme == "tg" else parsed.path.strip("/")).lower()
                  
                  # SOCKS5 через tg:// или t.me
                  if scheme in ("tg", "http", "https") and kind == "socks":
                      server = params.get("server", [None])[0]
                      port = params.get("port", [None])[0]
                      if not server or not port:
                          return None
                      port = int(port)
                      if port <= 0 or port > 65535:
                          return None
                      if not re.fullmatch(r"[a-zA-Z0-9.-]{3,255}", server):
                          return None
                      return {
                          "server": server,
                          "port": port,
                          "secret": None,
                          "protocol": "socks5",
                          "url": url
                      }
                  
                  # Прямой SOCKS5 URI
                  if scheme in ("socks", "socks5"):
                      if not parsed.hostname or not parsed.port:
                          return None
                      if parsed.port <= 0 or parsed.port > 65535:
                          return None
                      return {
                          "server": parsed.hostname,
                          "port": parsed.port,
                          "secret": None,
                          "protocol": "socks5",
                          "url": url
                      }
                  
                  # HTTP прокси
                  if scheme in ("http", "https") and parsed.hostname and parsed.port:
                      if parsed.netloc.lower() == "t.me":
                          # Это не прокси, а Telegram ссылка
                          pass
                      elif parsed.port > 0 and parsed.port <= 65535:
                          return {
                              "server": parsed.hostname,
                              "port": parsed.port,
                              "secret": None,
                              "protocol": "http",
                              "url": url
                          }
                  
                  # MTProto прокси
                  server = params.get("server", [None])[0]
                  port = params.get("port", [None])[0]
                  secret = params.get("secret", [None])[0]
                  
                  if not server or not port or not secret:
                      return None
                  
                  port = int(port)
                  if port <= 0 or port > 65535:
                      return None
                  
                  if not re.fullmatch(r"[a-zA-Z0-9.-]{3,255}", server):
                      return None
                  
                  if not re.fullmatch(r"(?:dd|ee)?[0-9a-fA-F]{32,128}", secret):
                      return None
                  
                  return {
                      "server": server,
                      "port": port,
                      "secret": secret,
                      "protocol": "mtproto",
                      "url": url
                  }
              except Exception:
                  return None
          
          queries = [
              "telegram proxy", "mtproto proxy", "tg://proxy",
              "t.me/proxy", "telegram socks5", "tg://socks"
          ]
          
          proxies = {}
          
          for query in queries:
              print(f"[*] Searching: {query}")
              try:
                  params = {"q": query, "sort": "updated", "order": "desc", "per_page": 20}
                  resp = requests.get("https://api.github.com/search/repositories",
                                    headers=headers, params=params, timeout=10)
                  if resp.status_code != 200:
                      continue
                  
                  repos = resp.json().get("items", [])[:max_repos]
                  
                  for repo in repos:
                      repo_name = repo["full_name"]
                      default_branch = repo.get("default_branch", "main")
                      
                      try:
                          tree_url = f"https://api.github.com/repos/{repo_name}/git/trees/{default_branch}?recursive=1"
                          tree_resp = requests.get(tree_url, headers=headers, timeout=10)
                          if tree_resp.status_code != 200:
                              continue
                          
                          files = tree_resp.json().get("tree", [])
                          proxy_files = [f for f in files if f["type"] == "blob"]
                          
                          for file in proxy_files[:10]:
                              raw_url = f"https://raw.githubusercontent.com/{repo_name}/{default_branch}/{file['path']}"
                              try:
                                  content_resp = requests.get(raw_url, timeout=10)
                                  if content_resp.status_code != 200:
                                      continue
                                  
                                  content = content_resp.text
                                  matches = TG_PROXY_RE.findall(content)
                                  
                                  for match in matches:
                                      parsed = parse_tg_url(match)
                                      if not parsed:
                                          continue
                                      
                                      protocol = parsed["protocol"]
                                      key = f"{protocol}:{parsed['server']}:{parsed['port']}:{parsed.get('secret') or ''}"
                                      
                                      if protocol == "mtproto":
                                          tg_url = f"tg://proxy?server={parsed['server']}&port={parsed['port']}&secret={parsed['secret']}"
                                          tme_url = f"https://t.me/proxy?server={parsed['server']}&port={parsed['port']}&secret={parsed['secret']}"
                                      elif protocol == "socks5":
                                          tg_url = f"tg://socks?server={parsed['server']}&port={parsed['port']}"
                                          tme_url = f"https://t.me/socks?server={parsed['server']}&port={parsed['port']}"
                                      else:
                                          tg_url = None
                                          tme_url = None
                                      
                                      sref = {
                                          "source": "github",
                                          "repo": repo_name,
                                          "path": file["path"],
                                          "url": raw_url
                                      }
                                      
                                      if key not in proxies:
                                          proxies[key] = {
                                              "server": parsed["server"],
                                              "host": parsed["server"],
                                              "port": parsed["port"],
                                              "secret": parsed.get("secret"),
                                              "protocol": protocol,
                                              "tg_url": tg_url,
                                              "tme_url": tme_url,
                                              "url": parsed.get("url"),
                                              "sources": [sref]
                                          }
                                      else:
                                          proxies[key]["sources"].append(sref)
                              except Exception as e:
                                  continue
                      except Exception as e:
                          print(f"[!] Error processing {repo_name}: {e}")
                          continue
                      
                      time.sleep(0.5)
              except Exception as e:
                  print(f"[!] Search error for '{query}': {e}")
                  continue
          
          os.makedirs("extracted", exist_ok=True)
          output = {
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "total_proxies": len(proxies),
              "proxies": list(proxies.values())
          }
          
          out_file = "extracted/tg_proxies_extracted.json"
          with open(out_file, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(f"[+] Saved {len(proxies)} proxies to {out_file}")
          PY
      
      - name: Install Xray core (optional)
        if: github.event.inputs.enable_xray == 'true'
        run: |
          set -euo pipefail
          XRAY_VERSION="v24.12.18"
          XRAY_ARCHIVE="Xray-linux-64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ARCHIVE}" \
            --output /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          sudo install -m 0755 /tmp/xray/xray /usr/local/bin/xray
          xray version
      
      - name: Check proxies
        env:
          MAX_CHECK_PROXIES: '2000'
          CHECK_TIMEOUT: '8'
          CONCURRENCY_LIMIT: '30'
          ENABLE_XRAY_CHECK: ${{ github.event.inputs.enable_xray || 'false' }}
        run: |
          set -euo pipefail
          python scripts/check_tg_proxies.py \
            --input extracted/tg_proxies_extracted.json \
            --output checked/tg_proxies_checked.json \
            --final-output data/tg_proxies_found.json \
            --max-check ${MAX_CHECK_PROXIES} \
            --timeout ${CHECK_TIMEOUT} \
            --concurrency ${CONCURRENCY_LIMIT} \
            $([ "${ENABLE_XRAY_CHECK}" = "true" ] && echo "--enable-xray" || echo "")
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ extracted/ checked/
          git diff --staged --quiet || git commit -m "🔄 Auto-update: Telegram proxies with extended protocol support"
          git push