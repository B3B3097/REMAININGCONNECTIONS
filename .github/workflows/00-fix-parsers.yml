name: 00 | MASTER FIX · Setup Everything

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Напиши 'FIX' для подтверждения (большие буквы)"
        required: true
        type: string
        default: ""
      
      backup:
        description: "Создать бэкап текущих workflow"
        required: false
        type: boolean
        default: true
      
      force:
        description: "Принудительный режим (перезаписать существующие файлы)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: master-fix
  cancel-in-progress: false

jobs:
  # =========================================================
  # 1. ВАЛИДАЦИЯ И ПОДГОТОВКА
  # =========================================================
  validate:
    name: 1 · Валидация
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_continue: ${{ steps.check.outputs.continue }}
    
    steps:
      - name: Check confirmation
        id: check
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "FIX" ]]; then
            echo "[!] Нужно написать 'FIX' в поле confirm"
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "[+] Подтверждение получено"
          echo "continue=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check current state
        run: |
          echo "=== Текущее состояние репозитория ==="
          echo ""
          echo "Файлы в .github/workflows/:"
          ls -la .github/workflows/ 2>/dev/null || echo "(папка не найдена)"
          echo ""
          echo "Папка data/:"
          ls -la data/ 2>/dev/null || echo "(не существует)"
          echo ""
          echo "Папка .github/generated/:"
          ls -la .github/generated/ 2>/dev/null || echo "(не существует)"
          echo ""
          echo "Папка docs/:"
          ls -la docs/ 2>/dev/null || echo "(не существует)"

  # =========================================================
  # 2. БЭКАП ТЕКУЩИХ WORKFLOW
  # =========================================================
  backup:
    name: 2 · Бэкап
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should_continue == 'true' && github.event.inputs.backup == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup
        run: |
          BACKUP_DIR=".github/workflows/backup_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          
          if [[ -d .github/workflows ]]; then
            cp .github/workflows/*.yml "$BACKUP_DIR/" 2>/dev/null || true
            echo "[+] Бэкап создан в: $BACKUP_DIR"
            ls -la "$BACKUP_DIR"
          else
            echo "[*] Нечего бэкапить"
          fi

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .github/workflows/backup_*/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "[*] Нет изменений для бэкапа"
          else
            git commit -m "chore: backup workflows before fix [skip ci]"
            git push origin main
            echo "[+] Бэкап закоммичен"
          fi

  # =========================================================
  # 3. СОЗДАНИЕ СТРУКТУРЫ
  # =========================================================
  setup-structure:
    name: 3 · Создание структуры
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should_continue == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p data
          mkdir -p .github/generated
          mkdir -p docs
          mkdir -p scripts
          
          echo "[+] Созданы папки:"
          ls -la | grep -E "^d" || true

      - name: Create .gitkeep files
        run: |
          touch data/.gitkeep
          touch .github/generated/.gitkeep
          echo "[+] .gitkeep файлы созданы"

      - name: Create placeholder data files
        run: |
          if [[ ! -f data/subscriptions_found.json ]]; then
            echo '{"generated_at":"","subscriptions":[]}' > data/subscriptions_found.json
          fi
          
          if [[ ! -f data/tg_proxies_found.json ]]; then
            echo '{"generated_at":"","proxies":[]}' > data/tg_proxies_found.json
          fi
          
          if [[ ! -f data/utils_found.json ]]; then
            echo '{"generated_at":"","utilities":[]}' > data/utils_found.json
          fi
          
          echo "[+] Placeholder файлы созданы"
          ls -la data/

      - name: Commit structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/ .github/generated/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "[*] Структура уже создана"
          else
            git commit -m "chore: create project structure [skip ci]"
            git push origin main
            echo "[+] Структура закоммичена"
          fi

  # =========================================================
  # 4. ИСПРАВЛЕНИЕ WORKFLOW
  # =========================================================
  fix-workflows:
    name: 4 · Исправление workflow
    runs-on: ubuntu-latest
    needs: [validate, setup-structure]
    if: needs.validate.outputs.should_continue == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Patch workflow files
        run: |
          python <<'PY'
          import yaml
          import os
          from pathlib import Path

          WORKFLOWS_DIR = Path(".github/workflows")
          PARSER_FILES = [
              "subscription-discovery.yml",
              "tg-proxy-discovery.yml",
              "utils-discovery.yml",
              "search-query-generator.yml",
          ]

          patched = []

          for filename in PARSER_FILES:
              filepath = WORKFLOWS_DIR / filename
              
              if not filepath.exists():
                  print(f"[!] {filename} не найден")
                  continue

              print(f"\n[*] Патчу {filename}...")

              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()

              try:
                  data = yaml.safe_load(content)
              except Exception as e:
                  print(f"[!] Ошибка парсинга {filename}: {e}")
                  continue

              on_block = data.get("on", {})

              if not isinstance(on_block, dict):
                  print(f"[*] 'on' не словарь — пропускаю")
                  continue

              modified = False

              # Убираем push
              if "push" in on_block:
                  del on_block["push"]
                  print(f"[+] Удалён блок 'push'")
                  modified = True

              # Убеждаемся что есть schedule
              if "schedule" not in on_block:
                  schedules = {
                      "subscription-discovery.yml": [{"cron": "15 */2 * * *"}],
                      "tg-proxy-discovery.yml": [{"cron": "35 * * * *"}],
                      "utils-discovery.yml": [{"cron": "20 */6 * * *"}],
                      "search-query-generator.yml": [{"cron": "40 */6 * * *"}],
                  }
                  if filename in schedules:
                      on_block["schedule"] = schedules[filename]
                      print(f"[+] Добавлен schedule")
                      modified = True

              # Убеждаемся что есть workflow_dispatch
              if "workflow_dispatch" not in on_block:
                  on_block["workflow_dispatch"] = None
                  print(f"[+] Добавлен workflow_dispatch")
                  modified = True

              if modified:
                  with open(filepath, "w", encoding="utf-8") as f:
                      yaml.dump(data, f, allow_unicode=True, sort_keys=False, default_flow_style=False)
                  patched.append(filename)
              else:
                  print(f"[*] Уже исправлен")

          print(f"\n[+] Исправлено файлов: {len(patched)}")
          for f in patched:
              print(f"    - {f}")
          PY

      - name: Commit workflow fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .github/workflows/*.yml
          
          if git diff --staged --quiet; then
            echo "[*] Workflow уже исправлены"
          else
            git commit -m "fix: remove push triggers from parsers [skip ci]"
            git push origin main
            echo "[+] Workflow исправлены"
          fi

  # =========================================================
  # 5. СОЗДАНИЕ DISPATCH PARSERS
  # =========================================================
  create-dispatch:
    name: 5 · Создание dispatch-parsers.yml
    runs-on: ubuntu-latest
    needs: [validate, fix-workflows]
    if: needs.validate.outputs.should_continue == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create dispatch-parsers.yml
        run: |
          cat > .github/workflows/dispatch-parsers.yml <<'YAML'
          name: Dispatch Parsers

          on:
            push:
              branches:
                - main
              paths-ignore:
                - 'README.md'
                - 'LICENSE'
                - '.github/workflows/**'
                - 'docs/**'
                - '*.md'
                - 'data/**'
                - '.github/generated/**'

            workflow_dispatch:
              inputs:
                force_run:
                  description: "Принудительный запуск (игнорировать 2 часа)"
                  required: false
                  type: boolean
                  default: false
                
                parsers:
                  description: "Какие парсеры запустить (all/subs/proxy/utils/queries)"
                  required: false
                  type: choice
                  options:
                    - all
                    - subscriptions
                    - tg_proxy
                    - utilities
                    - queries
                  default: all

          permissions:
            actions: write
            contents: read

          jobs:
            dispatch:
              name: Dispatch parsers
              runs-on: ubuntu-latest
              timeout-minutes: 5
              
              steps:
                - name: Check last workflow run
                  id: check
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    FORCE="${{ github.event.inputs.force_run }}"

                    if [[ "$FORCE" == "true" ]]; then
                      echo "[*] Принудительный запуск"
                      echo "should_run=true" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi

                    LAST_RUN=$(gh api repos/${{ github.repository }}/actions/runs \
                      --jq '.workflow_runs[] | select(.name | test("Discovery|Generator")) | select(.conclusion == "success") | .created_at' \
                      2>/dev/null | head -n 1 || true)

                    if [[ -z "$LAST_RUN" ]]; then
                      echo "[*] Успешных запусков ещё не было"
                      echo "should_run=true" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi

                    LAST_TS=$(date -d "$LAST_RUN" +%s)
                    NOW_TS=$(date +%s)
                    DIFF=$(( (NOW_TS - LAST_TS) / 60 ))

                    echo "[*] Последний запуск: $DIFF минут назад"

                    if [[ $DIFF -lt 120 ]]; then
                      echo "[*] Слишком рано — пропускаю"
                      echo "should_run=false" >> "$GITHUB_OUTPUT"
                    else
                      echo "[*] Можно запускать"
                      echo "should_run=true" >> "$GITHUB_OUTPUT"
                    fi

                - name: Determine which parsers to run
                  id: parsers
                  run: |
                    PARSERS="${{ github.event.inputs.parsers || 'all' }}"
                    echo "selected=$PARSERS" >> "$GITHUB_OUTPUT"
                    echo "[*] Выбрано: $PARSERS"

                - name: Trigger subscription-discovery
                  if: steps.check.outputs.should_run == 'true' && (steps.parsers.outputs.selected == 'all' || steps.parsers.outputs.selected == 'subscriptions')
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    echo "[*] Запускаю subscription-discovery..."
                    gh workflow run subscription-discovery.yml --ref main || true
                    sleep 15

                - name: Trigger tg-proxy-discovery
                  if: steps.check.outputs.should_run == 'true' && (steps.parsers.outputs.selected == 'all' || steps.parsers.outputs.selected == 'tg_proxy')
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    echo "[*] Запускаю tg-proxy-discovery..."
                    gh workflow run tg-proxy-discovery.yml --ref main || true
                    sleep 15

                - name: Trigger utils-discovery
                  if: steps.check.outputs.should_run == 'true' && (steps.parsers.outputs.selected == 'all' || steps.parsers.outputs.selected == 'utilities')
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    echo "[*] Запускаю utils-discovery..."
                    gh workflow run utils-discovery.yml --ref main || true
                    sleep 15

                - name: Trigger search-query-generator
                  if: steps.check.outputs.should_run == 'true' && (steps.parsers.outputs.selected == 'all' || steps.parsers.outputs.selected == 'queries')
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    echo "[*] Запускаю search-query-generator..."
                    gh workflow run search-query-generator.yml --ref main || true

                - name: Skip if too soon
                  if: steps.check.outputs.should_run == 'false'
                  run: |
                    echo "[*] Парсеры не запущены (прошло < 2 часов с последнего запуска)"
          YAML

          echo "[+] dispatch-parsers.yml создан"

      - name: Commit dispatch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .github/workflows/dispatch-parsers.yml
          
          if git diff --staged --quiet; then
            echo "[*] dispatch-parsers.yml уже существует"
          else
            git commit -m "feat: add dispatch-parsers workflow [skip ci]"
            git push origin main
            echo "[+] dispatch-parsers.yml закоммичен"
          fi

  # =========================================================
  # 6. ФИНАЛЬНЫЙ ОТЧЁТ
  # =========================================================
  report:
    name: 6 · Финальный отчёт
    runs-on: ubuntu-latest
    needs: [validate, backup, setup-structure, fix-workflows, create-dispatch]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Generate report
        run: |
          cat <<'EOF'
          ╔═══════════════════════════════════════════════════════════════╗
          ║                   ✅ MASTER FIX COMPLETE                      ║
          ╚═══════════════════════════════════════════════════════════════╝

          📦 Что было сделано:
          ───────────────────────────────────────────────────────────────
          ✅ Проверено состояние репозитория
          ✅ Создан бэкап workflow (если включено)
          ✅ Созданы папки: data/, .github/generated/, docs/, scripts/
          ✅ Созданы placeholder файлы в data/
          ✅ Убраны 'push' триггеры из 4 парсеров:
             • subscription-discovery.yml
             • tg-proxy-discovery.yml
             • utils-discovery.yml
             • search-query-generator.yml
          ✅ Добавлены schedule и workflow_dispatch в каждый парсер
          ✅ Создан dispatch-parsers.yml с умной логикой:
             • Запускает парсеры по очереди
             • Защищает от перегрузки (2 часа между запусками)
             • Игнорирует коммиты README/доков
             • Позволяет выбрать конкретные парсеры
             • Поддерживает принудительный запуск

          🎯 Следующие шаги:
          ───────────────────────────────────────────────────────────────
          1. Открой Actions → Dispatch Parsers
          2. Нажми Run workflow
          3. Поставь:
             • force_run: true (для первого запуска)
             • parsers: all (или выбери конкретные)
          4. Парсеры запустятся по очереди и не будут падать!

          📊 Как теперь работают парсеры:
          ───────────────────────────────────────────────────────────────
          • subscription-discovery: каждые 2 часа (15 минут)
          • tg-proxy-discovery: каждый час (35 минут)
          • utils-discovery: каждые 6 часов (20 минут)
          • search-query-generator: каждые 6 часов (40 минут)

          💡 Полезные команды:
          ───────────────────────────────────────────────────────────────
          • Запустить только подписки:
            Actions → Dispatch Parsers → parsers: subscriptions

          • Запустить всё принудительно:
            Actions → Dispatch Parsers → force_run: true, parsers: all

          • Проверить статус:
            Actions → смотри последние запуски

          ═══════════════════════════════════════════════════════════════
          🛜 REMAININGCONNECTIONS · Остаться на связи
          ═══════════════════════════════════════════════════════════════
          EOF

      - name: Write to summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # ✅ Master Fix Complete

          ## 📦 Что было сделано

          - ✅ Создана структура проекта (data/, .github/generated/)
          - ✅ Исправлены 4 парсера (убраны push триггеры)
          - ✅ Добавлены schedule в каждый парсер
          - ✅ Создан умный dispatch-parsers.yml

          ## 🎯 Следующие шаги

          1. Открой **Actions → Dispatch Parsers**
          2. Нажми **Run workflow**
          3. Параметры:
             - `force_run`: **true**
             - `parsers`: **all**
          4. Парсеры запустятся по очереди!

          ## 📊 Расписание парсеров

          | Парсер | Расписание |
          |--------|------------|
          | subscription-discovery | Каждые 2 часа |
          | tg-proxy-discovery | Каждый час |
          | utils-discovery | Каждые 6 часов |
          | search-query-generator | Каждые 6 часов |

          ## 💡 Полезные команды

```bash
          # Запустить только подписки
          Actions → Dispatch Parsers → parsers: subscriptions

          # Принудительный запуск всех
          Actions → Dispatch Parsers → force_run: true, parsers: all
```
          EOF