name: 00 | ONE-TIME SETUP · Pages + Domain + Deploy

on:
  workflow_dispatch:
    inputs:
      site_name:
        description: "Название сайта (будет в заголовке и README)"
        required: false
        type: string
        default: "REMAININGCONNECTIONS · Остаться на связи"

      domain_keyword:
        description: "Ключевое слово для домена (обязательно)"
        required: true
        type: string
        default: "remainingconnections"

      try_duckdns:
        description: "Пытаться получить бесплатный домен через DuckDNS (нужен токен в secrets.DUCKDNS_TOKEN)"
        required: false
        type: boolean
        default: true

      try_isadev:
        description: "Подготовить файлы для is-a.dev (бесплатный поддомен .is-a.dev, ручной PR)"
        required: false
        type: boolean
        default: true

      force_pages_rebuild:
        description: "Принудительно пересоздать Pages settings"
        required: false
        type: boolean
        default: false

      skip_deploy:
        description: "Пропустить финальный деплой (только настройка)"
        required: false
        type: boolean
        default: false

      duckdns_subdomain:
        description: "Желаемый поддомен на DuckDNS (без .duckdns.org). Оставь пустым — возьмётся из domain_keyword"
        required: false
        type: string
        default: ""

concurrency:
  group: one-time-setup-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  checks: write

env:
  PYTHON_VERSION: "3.11"
  DOCS_DIR: "docs"
  SITE_KEYWORD: ${{ github.event.inputs.domain_keyword || 'remainingconnections' }}
  SITE_NAME: ${{ github.event.inputs.site_name || 'REMAININGCONNECTIONS · Остаться на связи' }}

  TRY_DUCKDNS: ${{ github.event.inputs.try_duckdns == true && '1' || '0' }}
  TRY_ISADEV: ${{ github.event.inputs.try_isadev == true && '1' || '0' }}
  FORCE_PAGES_REBUILD: ${{ github.event.inputs.force_pages_rebuild == true && '1' || '0' }}
  SKIP_DEPLOY: ${{ github.event.inputs.skip_deploy == true && '1' || '0' }}

  DUCKDNS_SUBDOMAIN: ${{ github.event.inputs.duckdns_subdomain || '' }}

  # DuckDNS токен — нужно вручную добавить в Settings → Secrets → Actions → DUCKDNS_TOKEN
  # Получить можно за 1 минуту: https://www.duckdns.org (логин через GitHub)
  DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}

defaults:
  run:
    shell: bash

jobs:
  # =========================================================
  # 1. ПОДГОТОВКА И ПРОВЕРКА СТРУКТУРЫ
  # =========================================================
  prepare:
    name: 1 · Подготовка репозитория
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_dir: ${{ env.DOCS_DIR }}
      repo_name: ${{ steps.info.outputs.repo_name }}
      repo_owner: ${{ steps.info.outputs.repo_owner }}
      default_branch: ${{ steps.info.outputs.default_branch }}
      pages_url: ${{ steps.info.outputs.pages_url }}
      keyword: ${{ steps.info.outputs.keyword }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gather repository info
        id: info
        run: |
          set -euo pipefail

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          # Ключевое слово приводим к lower-case и убираем недопустимые символы
          KEYWORD="$(echo "${SITE_KEYWORD}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')"

          if [[ -z "$KEYWORD" ]]; then
            KEYWORD="remainingconnections"
          fi

          PAGES_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"

          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "default_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "pages_url=${PAGES_URL}" >> "$GITHUB_OUTPUT"
          echo "keyword=${KEYWORD}" >> "$GITHUB_OUTPUT"

          echo "=================================================="
          echo " Repository info"
          echo "=================================================="
          echo "Owner:          ${REPO_OWNER}"
          echo "Repo:           ${REPO_NAME}"
          echo "Default branch: ${DEFAULT_BRANCH}"
          echo "Keyword:        ${KEYWORD}"
          echo "Pages URL:      ${PAGES_URL}"
          echo "=================================================="

      - name: Check docs directory and index.html
        run: |
          set -euo pipefail

          DOCS="${DOCS_DIR}"

          if [[ ! -d "$DOCS" ]]; then
            echo "[*] Папка ${DOCS} не найдена. Создаю..."
            mkdir -p "$DOCS"
          fi

          if [[ ! -f "${DOCS}/index.html" ]]; then
            echo "[!] ${DOCS}/index.html не найден!"

            if [[ -f "index.html" ]]; then
              echo "[*] Найден index.html в корне — копирую в ${DOCS}/"
              cp index.html "${DOCS}/index.html"
            else
              echo "[*] Создаю базовый index.html-заглушку"
              cat > "${DOCS}/index.html" <<HTML
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${SITE_NAME}</title>
            <style>
              body { font-family: system-ui, sans-serif; background:#0b0f19; color:#f9fafb; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
              h1 { font-size: clamp(40px, 8vw, 96px); background:linear-gradient(90deg,#60a5fa,#a78bfa,#34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
              p { color:#9ca3af; max-width:600px; }
              a { color:#60a5fa; }
            </style>
          </head>
          <body>
            <div>
              <h1>ОСТАТЬСЯ НА СВЯЗИ 🛜</h1>
              <p>Сайт успешно задеплоен. Замени этот файл на свой <code>index.html</code>.</p>
              <p><a href="https://t.me/REMAININGCONNECTIONS" target="_blank">@REMAININGCONNECTIONS</a></p>
            </div>
          </body>
          </html>
          HTML
            fi
          fi

          echo "[*] Структура ${DOCS}/:"
          ls -lah "$DOCS" || true

      - name: Write deployment metadata
        run: |
          python - <<'PY'
          import json
          import datetime
          import os

          payload = {
              "deployed_at": datetime.datetime.utcnow().isoformat() + "Z",
              "repository": "${{ github.repository }}",
              "actor": "${{ github.actor }}",
              "run_id": "${{ github.run_id }}",
              "site_name": os.getenv("SITE_NAME"),
              "keyword": os.getenv("SITE_KEYWORD"),
          }

          os.makedirs(os.getenv("DOCS_DIR", "docs"), exist_ok=True)

          with open(f"{os.getenv('DOCS_DIR', 'docs')}/deploy.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print("[+] deploy.json создан")
          PY

      - name: Commit initial structure if needed
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${DOCS_DIR}" || true

          if git diff --staged --quiet; then
            echo "[*] Нет изменений для коммита"
          else
            git commit -m "chore(setup): prepare docs directory [skip ci]"
            git push origin "${{ steps.info.outputs.default_branch }}"
            echo "[*] Стартовая структура закоммичена"
          fi

  # =========================================================
  # 2. ВКЛЮЧЕНИЕ GITHUB PAGES ЧЕРЕЗ API
  # =========================================================
  setup-pages:
    name: 2 · Включение GitHub Pages
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15

    steps:
      - name: Check current Pages status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          OWNER="${{ needs.prepare.outputs.repo_owner }}"
          REPO="${{ needs.prepare.outputs.repo_name }}"

          echo "[*] Проверяю статус GitHub Pages для ${OWNER}/${REPO}"

          HTTP_CODE=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/pages" || echo "000")

          echo "HTTP code: ${HTTP_CODE}"

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "pages_enabled=true" >> "$GITHUB_OUTPUT"
            CURRENT_URL=$(jq -r '.html_url // empty' /tmp/pages.json)
            echo "current_url=${CURRENT_URL}" >> "$GITHUB_OUTPUT"
            echo "[+] Pages уже включены: ${CURRENT_URL}"
          else
            echo "pages_enabled=false" >> "$GITHUB_OUTPUT"
            echo "[*] Pages не включены или недоступны"
          fi

          cat /tmp/pages.json || true

      - name: Enable GitHub Pages (deploy from branch)
        if: steps.check.outputs.pages_enabled != 'true' || env.FORCE_PAGES_REBUILD == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          OWNER="${{ needs.prepare.outputs.repo_owner }}"
          REPO="${{ needs.prepare.outputs.repo_name }}"
          BRANCH="${{ needs.prepare.outputs.default_branch }}"
          DOCS="${DOCS_DIR}"

          echo "[*] Включаю GitHub Pages"
          echo "    Source: branch ${BRANCH}, path /${DOCS}"

          # Сначала пробуем новый API (deployment via Actions workflow)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/pages" \
            -d "{
              \"build_type\": \"legacy\",
              \"source\": {
                \"branch\": \"${BRANCH}\",
                \"path\": \"/${DOCS}\"
              }
            }" || true)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP code: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [[ "$HTTP_CODE" == "201" ]]; then
            echo "[+] Pages успешно включены!"
          elif [[ "$HTTP_CODE" == "409" ]]; then
            echo "[*] Pages уже существуют, обновляю настройки..."

            curl -s -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/pages" \
              -d "{
                \"source\": {
                  \"branch\": \"${BRANCH}\",
                  \"path\": \"/${DOCS}\"
                }
              }"

            echo "[+] Настройки обновлены"
          else
            echo "[!] Не удалось включить Pages автоматически."
            echo "    Возможно, нужно включить вручную:"
            echo "    Settings → Pages → Source: Deploy from a branch → ${BRANCH} / /${DOCS}"
          fi

      - name: Enforce HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          OWNER="${{ needs.prepare.outputs.repo_owner }}"
          REPO="${{ needs.prepare.outputs.repo_name }}"

          echo "[*] Включаю принудительный HTTPS"

          curl -s -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/pages" \
            -d '{"https_enforced": true}' > /dev/null

          echo "[+] HTTPS enforcement включён"

      - name: Wait for Pages to be ready
        run: |
          echo "[*] Жду 20 секунд, чтобы Pages успели инициализироваться..."
          sleep 20

  # =========================================================
  # 3. ДЕПЛОЙ САЙТА НА GITHUB PAGES
  # =========================================================
  deploy-site:
    name: 3 · Деплой сайта на GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - prepare
      - setup-pages
    if: env.SKIP_DEPLOY != '1'
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure docs directory exists
        run: |
          set -euo pipefail
          mkdir -p "${DOCS_DIR}"
          if [[ ! -f "${DOCS_DIR}/index.html" ]]; then
            echo "[!] ${DOCS_DIR}/index.html отсутствует после prepare"
            exit 1
          fi
          echo "[+] ${DOCS_DIR}/index.html найден"
          ls -lah "${DOCS_DIR}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DOCS_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployed URL
        run: |
          echo "=================================================="
          echo " ✅ Сайт задеплоен!"
          echo "=================================================="
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo "=================================================="

  # =========================================================
  # 4. ПОЛУЧЕНИЕ БЕСПЛАТНОГО ДОМЕНА ЧЕРЕЗ DUCKDNS
  # =========================================================
  configure-duckdns:
    name: 4 · Настройка DuckDNS домена
    runs-on: ubuntu-latest
    needs:
      - prepare
      - deploy-site
    if: always() && needs.deploy-site.result == 'success' && env.TRY_DUCKDNS == '1'
    timeout-minutes: 15
    outputs:
      duckdns_domain: ${{ steps.duckdns.outputs.domain }}
      duckdns_ok: ${{ steps.duckdns.outputs.ok }}

    steps:
      - name: Check DuckDNS token
        id: check
        run: |
          set -euo pipefail

          if [[ -z "${DUCKDNS_TOKEN}" ]]; then
            echo "[!] DUCKDNS_TOKEN не задан в Secrets"
            echo "    Добавь его: Settings → Secrets and variables → Actions → New repository secret"
            echo "    Имя: DUCKDNS_TOKEN"
            echo "    Получить токен: https://www.duckdns.org (вход через GitHub, 1 минута)"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "[+] DUCKDNS_TOKEN найден"
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Register DuckDNS subdomain
        id: duckdns
        if: steps.check.outputs.has_token == 'true'
        run: |
          set -euo pipefail

          # Определяем желаемый поддомен
          SUBDOMAIN="${DUCKDNS_SUBDOMAIN}"
          if [[ -z "$SUBDOMAIN" ]]; then
            SUBDOMAIN="${{ needs.prepare.outputs.keyword }}"
          fi

          # Приводим к валидному виду
          SUBDOMAIN="$(echo "$SUBDOMAIN" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')"

          DOMAIN="${SUBDOMAIN}.duckdns.org"

          echo "[*] Пытаюсь зарегистрировать: ${DOMAIN}"

          # Получаем публичный IP GitHub runner
          IP=$(curl -s https://api.ipify.org || echo "")

          # DuckDNS обновляет/создаёт поддомен через GET-запрос
          RESULT=$(curl -s "https://www.duckdns.org/update?domains=${SUBDOMAIN}&token=${DUCKDNS_TOKEN}&ip=${IP}")

          echo "DuckDNS response: ${RESULT}"

          if [[ "$RESULT" == "OK" ]]; then
            echo "[+] Домен успешно зарегистрирован: ${DOMAIN}"
            echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "[!] Не удалось зарегистрировать ${DOMAIN} (возможно, занято)"
            echo "    Попробуй другой subdomain в параметре duckdns_subdomain"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "domain=" >> "$GITHUB_OUTPUT"
          fi

      - name: Point DuckDNS CNAME to GitHub Pages
        if: steps.duckdns.outputs.ok == 'true'
        run: |
          set -euo pipefail

          SUBDOMAIN="${{ steps.duckdns.outputs.domain }}"
          SUBDOMAIN="${SUBDOMAIN%.duckdns.org}"

          OWNER="${{ needs.prepare.outputs.repo_owner }}"
          GITHUB_PAGES_HOST="${OWNER}.github.io"

          echo "[*] Настраиваю CNAME: ${SUBDOMAIN}.duckdns.org → ${GITHUB_PAGES_HOST}"

          RESULT=$(curl -s "https://www.duckdns.org/update?domains=${SUBDOMAIN}&token=${DUCKDNS_TOKEN}&cname=${GITHUB_PAGES_HOST}")

          echo "DuckDNS CNAME response: ${RESULT}"

          if [[ "$RESULT" == "OK" ]]; then
            echo "[+] CNAME настроен"
          else
            echo "[!] Не удалось настроить CNAME"
          fi

  # =========================================================
  # 5. ПРИВЯЗКА КАСТОМНОГО ДОМЕНА К GITHUB PAGES
  # =========================================================
  bind-custom-domain:
    name: 5 · Привязка кастомного домена к Pages
    runs-on: ubuntu-latest
    needs:
      - prepare
      - configure-duckdns
    if: always() && needs.configure-duckdns.outputs.duckdns_ok == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CNAME file
        run: |
          set -euo pipefail

          DOMAIN="${{ needs.configure-duckdns.outputs.duckdns_domain }}"

          if [[ -z "$DOMAIN" ]]; then
            echo "[!] Домен не получен, пропускаю"
            exit 0
          fi

          echo "[*] Создаю ${DOCS_DIR}/CNAME с содержимым: ${DOMAIN}"

          mkdir -p "${DOCS_DIR}"
          echo "$DOMAIN" > "${DOCS_DIR}/CNAME"

          cat "${DOCS_DIR}/CNAME"

      - name: Set custom domain via Pages API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          OWNER="${{ needs.prepare.outputs.repo_owner }}"
          REPO="${{ needs.prepare.outputs.repo_name }}"
          DOMAIN="${{ needs.configure-duckdns.outputs.duckdns_domain }}"

          echo "[*] Устанавливаю кастомный домен через API: ${DOMAIN}"

          HTTP_CODE=$(curl -s -o /tmp/pages_update.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/pages" \
            -d "{\"cname\": \"${DOMAIN}\", \"https_enforced\": true}")

          echo "HTTP code: ${HTTP_CODE}"
          cat /tmp/pages_update.json || true

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "[+] Кастомный домен установлен!"
          else
            echo "[!] Не удалось установить кастомный домен автоматически"
          fi

      - name: Commit CNAME file
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${DOCS_DIR}/CNAME" || true

          if git diff --staged --quiet; then
            echo "[*] CNAME не изменился"
          else
            git commit -m "chore(pages): add CNAME for custom domain [skip ci]"
            git push origin "${{ needs.prepare.outputs.default_branch }}"
            echo "[+] CNAME закоммичен"
          fi

  # =========================================================
  # 6. ПОДГОТОВКА ФАЙЛОВ ДЛЯ IS-A.DEV (ОПЦИОНАЛЬНО)
  # =========================================================
  prepare-isadev:
    name: 6 · Подготовка is-a.dev файлов
    runs-on: ubuntu-latest
    needs: prepare
    if: always() && env.TRY_ISADEV == '1'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate is-a.dev JSON record
        run: |
          set -euo pipefail

          OWNER="${{ needs.prepare.outputs.repo_owner }}"
          KEYWORD="${{ needs.prepare.outputs.keyword }}"

          mkdir -p .github/is-a-dev

          cat > ".github/is-a-dev/${KEYWORD}.json" <<JSON
          {
            "owner": {
              "username": "${OWNER}",
              "email": "${OWNER}@users.noreply.github.com"
            },
            "record": {
              "CNAME": "${OWNER}.github.io"
            },
            "proxied": false
          }
          JSON

          echo "[+] Создан файл: .github/is-a-dev/${KEYWORD}.json"
          cat ".github/is-a-dev/${KEYWORD}.json"

      - name: Generate is-a.dev instructions
        run: |
          cat > .github/is-a-dev/README.md <<'MD'
          # Получение бесплатного домена .is-a.dev

          Этот проект поддерживает бесплатный поддомен вида: