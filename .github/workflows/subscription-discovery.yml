name: Subscription Discovery

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      max_repos:
        description: 'Max repos to search'
        required: false
        default: '100'
      max_probe:
        description: 'Max subscriptions to probe'
        required: false
        default: '100'

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Search and extract subscriptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_REPOS: ${{ github.event.inputs.max_repos || '100' }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, base64, time
          from urllib.parse import urlparse
          import requests

          token = os.getenv("GITHUB_TOKEN")
          max_repos = int(os.getenv("MAX_REPOS", "100"))
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}

          queries = [
              "vless://", "vmess://", "ss://", "trojan://",
              "hysteria2://", "hy2://", "tuic://",
              "shadowsocks subscription", "v2ray subscription",
              "clash subscription", "xray config"
          ]

          found_urls = set()

          for query in queries:
              print(f"[*] Searching: {query}")
              try:
                  params = {"q": query, "sort": "updated", "order": "desc", "per_page": 30}
                  resp = requests.get("https://api.github.com/search/repositories",
                                    headers=headers, params=params, timeout=10)
                  if resp.status_code != 200:
                      continue

                  repos = resp.json().get("items", [])[:max_repos]

                  for repo in repos:
                      repo_name = repo["full_name"]
                      default_branch = repo.get("default_branch", "main")

                      try:
                          tree_url = f"https://api.github.com/repos/{repo_name}/git/trees/{default_branch}?recursive=1"
                          tree_resp = requests.get(tree_url, headers=headers, timeout=10)
                          if tree_resp.status_code != 200:
                              continue

                          files = tree_resp.json().get("tree", [])
                          sub_files = [f for f in files if f["type"] == "blob" and
                                     any(p in f["path"].lower() for p in
                                         ["subscription", "sub", "config", "node", "proxy"])]

                          for file in sub_files[:5]:
                              raw_url = f"https://raw.githubusercontent.com/{repo_name}/{default_branch}/{file['path']}"
                              found_urls.add(raw_url)
                      except Exception as e:
                          print(f"[!] Error processing {repo_name}: {e}")
                          continue

                      time.sleep(0.5)
              except Exception as e:
                  print(f"[!] Search error for '{query}': {e}")
                  continue

          subscriptions = []
          for url in found_urls:
              try:
                  print(f"[*] Fetching: {url}")
                  resp = requests.get(url, timeout=15, allow_redirects=True)
                  if resp.status_code == 200 and resp.content:
                      content = resp.text
                      subscriptions.append({
                          "url": url,
                          "content": content,
                          "size_bytes": len(content),
                          "discovered_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
                      })
              except Exception as e:
                  print(f"[!] Fetch error: {e}")
                  continue

          os.makedirs("extracted", exist_ok=True)
          output = {
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "total_subscriptions": len(subscriptions),
              "subscriptions": subscriptions
          }

          out_file = "extracted/subscriptions_extracted.json"
          with open(out_file, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(f"[+] Saved {len(subscriptions)} subscriptions to {out_file}")
          PYEOF

      - name: Install Xray core for strict node checks
        run: |
          set -euo pipefail
          XRAY_VERSION="v24.12.18"
          XRAY_ARCHIVE="Xray-linux-64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ARCHIVE}" \
            --output /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          sudo install -m 0755 /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: Validate and probe subscriptions through Xray
        env:
          MAX_PROBE_SUBSCRIPTIONS: ${{ github.event.inputs.max_probe || '100' }}
          NODES_PER_SUBSCRIPTION: '50'
          XRAY_PROBE_TIMEOUT: '8'
        run: |
          set -euo pipefail
          mkdir -p checked
          python scripts/probe_subscription_configs.py \
            --input extracted/subscriptions_extracted.json \
            --output checked/subscriptions_probed.json \
            --max-subscriptions ${MAX_PROBE_SUBSCRIPTIONS} \
            --nodes-per-sub ${NODES_PER_SUBSCRIPTION} \
            --timeout ${XRAY_PROBE_TIMEOUT}

      - name: Copy to data directory
        run: |
          mkdir -p data
          cp checked/subscriptions_probed.json data/subscriptions_found.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ extracted/ checked/
          if git diff --staged --quiet; then
            echo "[*] No changes to commit."
          else
            git commit -m "🔄 Auto-update: subscriptions with Xray validation"
            git push
          fi