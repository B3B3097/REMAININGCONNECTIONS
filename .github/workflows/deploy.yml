name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOCS_DIR: "docs"
  DATA_DIR: "data"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure directory structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DOCS_DIR}" "${DATA_DIR}"
          echo "[+] Directories ready"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir requests pyyaml

      - name: Generate Static Dashboard
        run: |
          python scripts/dashboard_generator.py --data-dir ${{ env.DATA_DIR }} --output-dir ${{ env.DOCS_DIR }}

      - name: Copy data into docs (so it is served by Pages)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${DOCS_DIR}/data"
          mkdir -p "${DOCS_DIR}/data"

          mapfile -d '' json_files < <(find "${DATA_DIR}" -maxdepth 1 -type f -name '*.json' -print0)
          if (( ${#json_files[@]} == 0 )); then
            echo "[ERROR] No JSON files found in ${DATA_DIR}/" >&2
            exit 1
          fi

          for file in "${json_files[@]}"; do
            cp -- "$file" "${DOCS_DIR}/data/"
          done

          echo "[+] Copied JSON data files to ${DOCS_DIR}/data/:"
          find "${DOCS_DIR}/data" -maxdepth 1 -type f -name '*.json' -print

      - name: Validate JSON data integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "[*] Checking JSON files..."
          while IFS= read -r -d '' file; do
            if ! jq empty "$file" >/dev/null 2>&1; then
              echo "[ERROR] Malformed JSON: $file" >&2
              exit 1
            fi
            echo "[OK] $file"
          done < <(find "${DOCS_DIR}/data" -maxdepth 1 -type f -name '*.json' -print0)

      - name: Validate required dashboard data
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "subscriptions_found.json"
            "tg_proxies_found.json"
            "utils_found.json"
          )
          for file in "${required[@]}"; do
            if [[ ! -s "${DOCS_DIR}/data/${file}" ]]; then
              echo "[ERROR] Missing or empty required data file: ${DOCS_DIR}/data/${file}" >&2
              exit 1
            fi
          done
          echo "[+] Required dashboard data is present"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./${{ env.DOCS_DIR }}
          retention-days: 14

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "============================================"
          echo " Deployment successful"
          echo "============================================"
          echo " URL: ${{ steps.deployment.outputs.page_url }}"
          echo " Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "============================================"