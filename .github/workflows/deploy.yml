name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOCS_DIR: "docs"
  DATA_DIR: "data"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure directory structure
        run: |
          set -euo pipefail
          mkdir -p "${DOCS_DIR}" "${DATA_DIR}"
          echo "[+] Directories ready"

      - name: Validate JSON data integrity
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi
          echo "[*] Checking JSON files..."
          found=0
          find ${DATA_DIR} -name "*.json" -type f 2>/dev/null | while read -r file; do
            if ! jq empty "$file" >/dev/null 2>&1; then
              echo "[ERROR] Malformed JSON: $file"
              exit 1
            fi
            echo "[OK] $file"
            found=1
          done
          echo "[+] JSON validation complete"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./${{ env.DOCS_DIR }}
          retention-days: 14

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "============================================"
          echo " Deployment successful"
          echo "============================================"
          echo " URL: ${{ steps.deployment.outputs.page_url }}"
          echo " Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "============================================"