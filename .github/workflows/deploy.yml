name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOCS_DIR: "docs"
  DATA_DIR: "data"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure directory structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DOCS_DIR}" "${DATA_DIR}"
          echo "[+] Directories ready"

      - name: Copy data into docs (so it is served by Pages)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${DOCS_DIR}/data"
          mkdir -p "${DOCS_DIR}/data"

          mapfile -d '' json_files < <(find "${DATA_DIR}" -maxdepth 1 -type f -name '*.json' -print0)
          if (( ${#json_files[@]} == 0 )); then
            echo "[ERROR] No JSON files found in ${DATA_DIR}/" >&2
            exit 1
          fi

          for file in "${json_files[@]}"; do
            cp -- "$file" "${DOCS_DIR}/data/"
          done

          echo "[+] Copied JSON data files to ${DOCS_DIR}/data/:"
          find "${DOCS_DIR}/data" -maxdepth 1 -type f -name '*.json' -print

      - name: Validate JSON data integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "[*] Checking JSON files..."
          while IFS= read -r -d '' file; do
            if ! jq empty "$file" >/dev/null 2>&1; then
              echo "[ERROR] Malformed JSON: $file" >&2
              exit 1
            fi
            echo "[OK] $file"
          done < <(find "${DOCS_DIR}/data" -maxdepth 1 -type f -name '*.json' -print0)

      - name: Validate required dashboard data
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "subscriptions_found.json"
            "tg_proxies_found.json"
            "utils_found.json"
          )
          for file in "${required[@]}"; do
            if [[ ! -s "${DOCS_DIR}/data/${file}" ]]; then
              echo "[ERROR] Missing or empty required data file: ${DOCS_DIR}/data/${file}" >&2
              exit 1
            fi
          done
          echo "[+] Required dashboard data is present"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./${{ env.DOCS_DIR }}
          retention-days: 14

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "============================================"
          echo " Deployment successful"
          echo "============================================"
          echo " URL: ${{ steps.deployment.outputs.page_url }}"
          echo " Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "============================================"
@@END@@Обновляю `speedtest-fix.js`: исправляю генерацию случайных данных, контроль HTTP-статуса, тайм-аут и двойное завершение XHR.@@TOOL@@ EDIT_FILE
@@ARGS@@ {"path":"docs/speedtest-fix.js"}
@@CONTENT@@// Speed Test Upload Fix
// This implementation is intended to replace the inline measureUpload()
// in docs/index.html. It is kept here as the canonical reference.

async function measureUpload() {
    els.speedPhase.textContent = "Measuring upload...";
    setGauge(0, "upload");

    const chunkSize = 256 * 1024;
    const maxBytes = Math.max(0, Number(SPEED.maxUploadBytes) || 0);
    const chunk = new Uint8Array(chunkSize);

    // Web Crypto accepts at most 65536 bytes per call.
    for (let offset = 0; offset < chunk.length; offset += 65536) {
        crypto.getRandomValues(chunk.subarray(offset, Math.min(offset + 65536, chunk.length)));
    }

    const parts = [];
    let remaining = maxBytes;
    while (remaining > 0) {
        const size = Math.min(chunk.length, remaining);
        parts.push(size === chunk.length ? chunk : chunk.slice(0, size));
        remaining -= size;
    }
    const bigPayload = new Blob(parts, { type: "application/octet-stream" });

    return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        const start = performance.now();
        let lastReport = start;
        let lastLoaded = 0;
        let settled = false;

        const finish = (value, logMessage, logValue = "") => {
            if (settled) return;
            settled = true;
            if (logMessage) speedLog(logMessage, logValue);
            resolve(value);
        };

        xhr.timeout = 15000;

        xhr.upload.addEventListener("progress", (event) => {
            if (state.speedAbort) {
                xhr.abort();
                return;
            }

            const now = performance.now();
            if (event.lengthComputable && now - lastReport > 200) {
                const elapsed = (now - lastReport) / 1000;
                const uploaded = event.loaded - lastLoaded;
                const instantMbps = formatMbps(uploaded / elapsed);

                setGauge(instantMbps, "upload");
                speedLog(
                    `upload ${Math.round(event.loaded / 1024)} KB / ${Math.round(event.total / 1024)} KB`,
                    `${instantMbps.toFixed(2)} Mbps`
                );
                lastReport = now;
                lastLoaded = event.loaded;
            }
        });

        xhr.addEventListener("load", () => {
            if (state.speedAbort) {
                finish(null, "upload", "aborted");
                return;
            }
            if (xhr.status < 200 || xhr.status >= 300) {
                finish(null, "upload", `HTTP ${xhr.status}`);
                return;
            }

            const totalElapsed = (performance.now() - start) / 1000;
            if (totalElapsed <= 0 || bigPayload.size <= 0) {
                finish(null);
                return;
            }

            const mbps = formatMbps(bigPayload.size / totalElapsed);
            setGauge(mbps, "upload");
            finish(mbps, `upload complete ${Math.round(bigPayload.size / 1024)} KB`, `${mbps.toFixed(2)} Mbps`);
        });

        xhr.addEventListener("error", () => finish(null, "upload", "network error"));
        xhr.addEventListener("timeout", () => finish(null, "upload", "timeout"));
        xhr.addEventListener("abort", () => finish(null, "upload", "aborted"));

        try {
            xhr.open("POST", SPEED.uploadUrl, true);
            xhr.setRequestHeader("Content-Type", "application/octet-stream");
            xhr.send(bigPayload);
        } catch (error) {
            finish(null, "upload", `error: ${error.message || "request failed"}`);
        }
    });
}
