      - name: Validate JSON data integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "[*] Checking JSON files..."
          # Use python for validation to avoid external dependencies like 'jq'
          find "${DOCS_DIR}/data" -maxdepth 1 -type f -name '*.json' -print0 | \
          xargs -0 python3 -c "import json, sys; [json.load(open(f)) for f in sys.argv[1:]]" || {
            echo "[ERROR] Malformed JSON detected!" >&2
            exit 1
          }
          find "${DOCS_DIR}/data" -maxdepth 1 -type f -name '*.json' -exec echo "[OK] {}" \;