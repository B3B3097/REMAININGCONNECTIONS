[pytest]
# pytest configuration for REMAININGCONNECTIONS

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 7.0

# Additional command line options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers
    --strict-markers
    # Strict config
    --strict-config
    # Show warnings
    -W default
    # Coverage reporting (commented out by default)
    # --cov=scripts
    # --cov-report=html
    # --cov-report=term-missing
    # Parallel execution (commented out by default)
    # -n auto
    # Timeout for tests
    --timeout=300

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that require network access
    integration: marks integration tests
    unit: marks unit tests
    smoke: marks smoke tests for quick validation
    requires_xray: marks tests that require Xray binary
    requires_proxy: marks tests that require a running proxy

# Asyncio configuration
asyncio_mode = auto

# Test execution options
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Coverage options (when enabled)
[coverage:run]
source = scripts
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov